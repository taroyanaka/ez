<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill-in-the-Blank Learning App</title>
  <meta name="description" content="A premium flashcard app for fill-in-the-blank questions.">
  <link rel="stylesheet" href="style.css">
  <script src="../game/loader.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header>
      <a href="../index.html" id="top-link" style="text-decoration: none; color: #94a3b8; font-size: 0.8rem; margin-bottom: 0.5rem; display: inline-block;">← TOP PAGE</a>
      <div id="login-required-msg" style="color: #ef4444; font-size: 0.8rem; font-weight: bold; display: none; margin-bottom: 0.5rem;">ログイン必要</div>
      <div id="my-data-only-container" style="display: flex; align-items: center; gap: 0.3rem; margin-bottom: 1rem;">
          <input type="checkbox" id="my-data-only-toggle" checked onchange="handleToggleMyData()" style="cursor: pointer; accent-color: var(--primary);">
          <label for="my-data-only-toggle" style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; cursor: pointer;">マイデータのみ表示</label>
      </div>
      <h1>Knowledge Builder</h1>
      <nav class="tabs">
        <button id="tab-create" type="button" class="tab-btn active" onclick="event.preventDefault(); switchTab('create')">Problem Creation</button>
        <button id="tab-learn" type="button" class="tab-btn" onclick="event.preventDefault(); switchTab('learn')">Learning Mode</button>
        <button id="tab-audio-learn" type="button" class="tab-btn" onclick="event.preventDefault(); switchTab('audio-learn')">Audio Learning</button>
      </nav>
    </header>

    <main>
      <!-- PROBLEM CREATION TAB -->
      <section id="section-create" class="tab-content active">
        <div id="ez-chunk-container" data-resource-type="fill_in_the_blank"></div>
        <div class="card create-card">
          <h2>Add New Problem</h2>
          <div class="form-group">
            <label for="question-input">Sentence (Full correct text)</label>
            <textarea id="question-input" rows="3" placeholder="e.g. My favorite fruit is apple and banana."></textarea>
          </div>
          <div class="form-group">
            <label>Words to hide (one per line)</label>
            <div id="answers-container">
              <div class="answer-box">
                <textarea class="answer-input" rows="3" placeholder="apple&#10;banana"></textarea>
                <button type="button" class="remove-btn" onclick="removeAnswerBox(this)" style="display: none;" title="Remove list">&times;</button>
              </div>
            </div>
            <button type="button" class="secondary-btn add-list-btn" onclick="addAnswerBox()" style="margin-top: 0.5rem; width: 100%; border-style: dashed; background: rgba(255,255,255,0.02);">+ リストを追加</button>
            <small class="help-text" style="display: block; margin-top: 0.5rem;">These words will be replaced by dropdown choices. You can create multiple word lists for the same sentence.</small>
            <button id="add-stack-btn" type="button" class="secondary-btn" onclick="event.preventDefault(); addWordsToStack()" style="margin-top: 0.5rem; width: 100%;">すべてのリストをスタックに追加</button>
          </div>
          <button id="add-problem-btn" type="button" class="primary-btn" onclick="event.preventDefault(); addProblem()">Add Problem</button>
        </div>



        <div class="card list-card">
          <h2>Problem List</h2>
          <div class="problems-grid" id="problems-list">
            <!-- Problems will be injected here -->
          </div>
        </div>
      </section>

      <!-- LEARNING MODE TAB -->
      <section id="section-learn" class="tab-content">
        <div class="card learn-card">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <h2 style="margin: 0;">Learning Mode</h2>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
              <label style="font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-secondary);">
                <input type="checkbox" id="once-ok-checkbox" checked>
                Once OK (一度正解で自動入力)
              </label>
              <label style="font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-secondary);">
                <input type="checkbox" id="auto-add-stack" checked>
                間違えたら自動でスタックに追加
              </label>
            </div>
          </div>
          
          <div id="problem-selector-container" style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; background: rgba(255,255,255,0.05); padding: 0.75rem; border-radius: 12px; border: 1px solid var(--glass-border); flex-wrap: wrap;">
            <label for="learning-problem-select" style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 600;">問題を選択:</label>
            <select id="learning-problem-select" onchange="renderLearningMode()" style="flex: 1; padding: 0.5rem; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.3); color: var(--text-color); cursor: pointer; outline: none;">
              <!-- Options injected by JS -->
            </select>
          </div>

          <div id="learning-container">

            <!-- Learning interface injected here -->
          </div>
        </div>
      </section>

      <!-- AUDIO LEARNING MODE TAB -->
      <section id="section-audio-learn" class="tab-content">
        <div class="card learn-card">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <h2 style="margin: 0;">Audio Learning Mode</h2>
            <div class="audio-settings" style="display: flex; gap: 1rem; flex-wrap: wrap; background: rgba(0,0,0,0.2); padding: 0.75rem; border-radius: 8px;">
              <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary);">
                言語:
                <select id="audio-lang" style="padding: 0.3rem; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--glass-border);">
                  <option value="ja-JP">日本語 (ja)</option>
                  <option value="en-US">English (en)</option>
                </select>
              </label>
              <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary);">
                速度:
                <input type="range" id="audio-speed" min="0.5" max="2.0" step="0.1" value="1.0" style="width: 80px;" oninput="document.getElementById('audio-speed-val').textContent = this.value + 'x'">
                <span id="audio-speed-val">1.0x</span>
              </label>
              <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary);">
                待機(秒):
                <input type="number" id="audio-wait" min="1" max="10" value="3" style="width: 50px; padding: 0.3rem; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--glass-border);">
              </label>
              <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary);">
                待機条件文字数:
                <input type="number" id="audio-wait-chars" min="0" max="100" value="3" style="width: 50px; padding: 0.3rem; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid var(--glass-border);">
              </label>
              <label style="font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); cursor: pointer;">
                <input type="checkbox" id="audio-skip-wrong" checked style="cursor: pointer; accent-color: var(--primary); width: 16px; height: 16px;">
                ミス時に読み上げスキップ
              </label>
            </div>
          </div>
          
          <div id="audio-problem-selector-container" style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; background: rgba(255,255,255,0.05); padding: 0.75rem; border-radius: 12px; border: 1px solid var(--glass-border); flex-wrap: wrap;">
            <label for="audio-problem-select" style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 600;">問題を選択:</label>
            <select id="audio-problem-select" onchange="initAudioLearning()" style="flex: 1; padding: 0.5rem; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.3); color: var(--text-color); cursor: pointer; outline: none;">
            </select>
            <button class="primary-btn" id="audio-play-btn" onclick="startAudioSequence()" style="padding: 0.5rem 1.5rem;">Play</button>
            <button class="secondary-btn" id="audio-stop-btn" onclick="stopAudioSequence()" style="padding: 0.5rem 1rem; display: none; background: rgba(239, 68, 68, 0.2); color: #fca5a5;">Stop</button>
          </div>

          <div id="audio-error-msg" style="color: #ef4444; font-size: 0.9rem; margin-bottom: 1rem; display: none; padding: 1rem; background: rgba(239, 68, 68, 0.1); border-radius: 8px;"></div>

          <div id="audio-learning-container" style="display: none; flex-direction: column; gap: 1.5rem;">
             <div id="audio-text-display" class="learning-item" style="font-size: 1.1rem; line-height: 2.2; text-align: left;"></div>
             <div id="audio-timer-bar" style="height: 4px; background: var(--primary); width: 0%; transition: width 0.1s linear; border-radius: 2px;"></div>
             <div id="audio-choices-container" style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Stack UI -->
  <button id="stack-toggle-btn" onclick="toggleStack()">
      <i class="fas fa-list-ul"></i>
      <span id="stack-badge" style="display: none;">0</span>
  </button>

  <div id="stack-panel">
      <div class="stack-header">
          <h3>スタック</h3>
          <button class="btn-icon" onclick="toggleStack()">
              <i class="fas fa-times">✖</i>
          </button>
      </div>
      <div id="stack-list" class="stack-list">
          <!-- Stacked items will appear here -->
      </div>
      <div style="display: flex; flex-direction: column; gap: 0.75rem;">
          <button class="primary-btn" onclick="copyStackToClipboard(true)" style="justify-content: center;">
              コピー (=付き)
          </button>
          <button class="primary-btn" onclick="copyStackToClipboard(false)" style="justify-content: center;">
              コピー (=無し)
          </button>
          <button class="secondary-btn" onclick="clearStack()" style="justify-content: center; background: rgba(255,255,255,0.05); color: #f28b82;">
              スタックをクリア
          </button>
      </div>
  </div>

  <script src="../env.js"></script>
  <script src="../chunk-widget.js"></script>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fill-in-the-Blank Learning App</title>
  <meta name="description" content="A premium flashcard app for fill-in-the-blank questions.">
  <link rel="stylesheet" href="style.css">
  <script>
      if (localStorage.getItem('game_mode') === 'on') {
          document.write('<link rel="stylesheet" href="../game.css">');
      }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header>
      <a href="../index.html" id="top-link" style="text-decoration: none; color: #94a3b8; font-size: 0.8rem; margin-bottom: 0.5rem; display: inline-block;">← TOP PAGE</a>
      <div id="login-required-msg" style="color: #ef4444; font-size: 0.8rem; font-weight: bold; display: none; margin-bottom: 0.5rem;">ログイン必要</div>
      <div id="my-data-only-container" style="display: flex; align-items: center; gap: 0.3rem; margin-bottom: 1rem;">
          <input type="checkbox" id="my-data-only-toggle" checked onchange="handleToggleMyData()" style="cursor: pointer; accent-color: var(--primary);">
          <label for="my-data-only-toggle" style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; cursor: pointer;">マイデータのみ表示</label>
      </div>
      <h1>Knowledge Builder</h1>
      <nav class="tabs">
        <button id="tab-create" type="button" class="tab-btn active" onclick="event.preventDefault(); switchTab('create')">Problem Creation</button>
        <button id="tab-learn" type="button" class="tab-btn" onclick="event.preventDefault(); switchTab('learn')">Learning Mode</button>
      </nav>
    </header>

    <main>
      <!-- PROBLEM CREATION TAB -->
      <section id="section-create" class="tab-content active">
        <div class="card create-card">
          <h2>Add New Problem</h2>
          <div class="form-group">
            <label for="question-input">Sentence (Full correct text)</label>
            <textarea id="question-input" rows="3" placeholder="e.g. My favorite fruit is apple and banana."></textarea>
          </div>
          <div class="form-group">
            <label for="answer-input">Words to hide (one per line)</label>
            <textarea id="answer-input" rows="3" placeholder="apple&#10;banana"></textarea>
            <small class="help-text">These words will be replaced by dropdown choices.</small>
          </div>
          <button id="add-problem-btn" type="button" class="primary-btn" onclick="event.preventDefault(); addProblem()">Add Problem</button>
        </div>

        <div class="card data-actions">
          <button type="button" class="secondary-btn" onclick="event.preventDefault(); exportData()">Export JSON</button>
          <label class="secondary-btn file-upload">
            Import JSON <input type="file" id="import-json" accept=".json" onchange="importData(event)">
          </label>
        </div>

        <div class="card api-actions" style="margin-top: 1rem;">
          <h2>API Tests</h2>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <button type="button" class="secondary-btn" onclick="event.preventDefault(); apiGetAll()">GET All</button>
            <button type="button" class="secondary-btn" onclick="event.preventDefault(); apiGetById()">GET by ID</button>
            <button type="button" class="secondary-btn" onclick="event.preventDefault(); apiCreate()">POST</button>
            <button type="button" class="secondary-btn" onclick="event.preventDefault(); apiUpdate()">PUT</button>
            <button type="button" class="secondary-btn" onclick="event.preventDefault(); apiDelete()">DELETE</button>
          </div>
        </div>

        <div class="card list-card">
          <h2>Problem List</h2>
          <div class="problems-grid" id="problems-list">
            <!-- Problems will be injected here -->
          </div>
        </div>
      </section>

      <!-- LEARNING MODE TAB -->
      <section id="section-learn" class="tab-content">
        <div class="card learn-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h2 style="margin: 0;">Learning Mode</h2>
            <label style="font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-secondary);">
              <input type="checkbox" id="once-ok-checkbox" checked>
              Once OK (一度正解で自動入力)
            </label>
          </div>
          
          <div id="problem-selector-container" style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem; background: rgba(255,255,255,0.05); padding: 0.75rem; border-radius: 12px; border: 1px solid var(--glass-border);">
            <label for="learning-problem-select" style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 600;">問題を選択:</label>
            <select id="learning-problem-select" onchange="renderLearningMode()" style="flex: 1; padding: 0.5rem; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.3); color: var(--text-color); cursor: pointer; outline: none;">
              <!-- Options injected by JS -->
            </select>
          </div>

          <div id="learning-container">

            <!-- Learning interface injected here -->
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="../env.js"></script>
  <script src="app.js"></script>
</body>
</html>

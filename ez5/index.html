<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Fill-in-the-Blank</title>
    <link rel="stylesheet" href="style.css">
    <script>
        if (localStorage.getItem('game_mode') !== 'off') {
            document.write('<link rel="stylesheet" href="../game.css">');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav>
        <div class="top-link-container">
            <a href="../index.html" id="top-link"><i class="fas fa-arrow-left"></i> TOP PAGE</a>
        </div>
        <div class="tab-container">
            <button class="tab-btn" id="tab-play" onclick="switchTab('play')">Play (学習)</button>
            <button class="tab-btn active" id="tab-create" onclick="switchTab('create')">Create (作成)</button>
        </div>
    </nav>

    <main>
        <!-- Play Mode View -->
        <div id="play-view" class="view">
            <h2>学習モード (Play)</h2>
            <p style="color: var(--text-secondary); margin-bottom: 1rem; font-size: 0.9rem;">
                保存されたリストが表示されます。画像をタップすると黒塗り（マスク）の表示・非表示が切り替わります。
            </p>
            <div id="play-list-container" style="display: flex; flex-direction: column; gap: 2rem;">
                <!-- Play cards will be rendered here -->
            </div>
        </div>

        <!-- Create Mode View -->
        <div id="create-view" class="view active">
            <p style="color: var(--text-secondary); margin-bottom: 1rem; font-size: 0.9rem;">
                元画像を読み込み、隠したい部分をタップやドラッグで黒く塗りつぶします。「Save to List」でリストに一時保存します。
            </p>
            <div class="file-inputs">
                <div>
                    <label>元画像 (Base Image):</label>
                    <input type="file" id="create-orig-img" accept="image/*">
                </div>
            </div>

            <div class="controls floating-toolbar" id="create-controls" style="display: none;">
                <button class="btn active" id="btn-brush" onclick="setMode('brush')" title="Brush (ブラシ)"><i class="fas fa-paint-brush"></i></button>
                <button class="btn" id="btn-eraser" onclick="setMode('eraser')" title="Eraser (消しゴム)"><i class="fas fa-eraser"></i></button>
                
                <div class="toolbar-separator"></div>
                
                <div style="display: flex; align-items: center; gap: 0.5rem; padding: 0 0.5rem;">
                    <i class="fas fa-circle" style="font-size: 0.7rem; color: var(--text-secondary);"></i>
                    <input type="range" id="brush-size" min="5" max="100" value="20" style="width: 70px;">
                </div>
                
                <div class="toolbar-separator"></div>
                
                <button class="btn" id="btn-undo" onclick="undo()" disabled title="Undo (元に戻す)"><i class="fas fa-undo"></i></button>
                <button class="btn" id="btn-redo" onclick="redo()" disabled title="Redo (やり直す)"><i class="fas fa-redo"></i></button>

                <div class="toolbar-separator"></div>

                <button class="btn btn-primary" onclick="saveRecord()" style="background: #10b981; border-color: #10b981;" title="Save to List (保存)">
                    <i class="fas fa-save"></i>
                </button>
            </div>

            <div class="canvas-container" id="create-canvas-container" style="display: none;">
                <img id="create-bg-img" style="display:none; position: absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; z-index: 1;">
                <canvas id="create-canvas" style="position: relative; z-index: 2; cursor: crosshair;"></canvas>
            </div>

            <div id="saved-list-container" style="margin-top: 2rem;">
                <h3>保存されたペア (一時保存)</h3>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 1rem;">※このデータはブラウザのメモリ上に一時保存されています。ページをリロードすると消去されます。</p>
                <div id="saved-list" style="display: flex; flex-direction: column; gap: 1rem;">
                    <!-- Saved items will appear here -->
                </div>
            </div>
        </div>
    </main>

    <script src="../env.js"></script>
    <script src="app.js"></script>
</body>
</html>

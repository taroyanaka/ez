<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tap Animation Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <section class="panel">
      <div class="row" style="justify-content: space-between;">
        <div class="counter">TAP <span id="tapCount">0</span></div>
        <button class="tap-btn" id="tapButton" type="button">TAP / 連打</button>
      </div>
      <div class="row" style="margin-top: 10px;">
        <label class="label" for="tapStep">nタップ毎に1アニメ追加:
          <input id="tapStep" class="num" type="number" min="1" value="1">
        </label>
        <button class="tap-btn" id="resetButton" type="button" style="min-width: 120px;">RESET</button>
        <span class="small">有効アニメ数: <span class="value" id="activeCount">0</span></span>
      </div>
      <div class="checks" id="checks"></div>

      <div class="row" style="margin-top: 15px; border-top: 1px solid #5a4a1f; padding-top: 15px;">
        <label class="label" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="vibrateEnabled" checked style="width: 18px; height: 18px; cursor: pointer;">
          <span style="font-size: 14px; font-weight: bold; color: var(--gold);">バイブレーション (スマホ振動) を有効にする</span>
        </label>
      </div>

      <div class="row" style="margin-top: 10px;" id="vibrateConfigRow">
        <label class="label" style="display: flex; flex-direction: column; gap: 6px; width: 100%;">
          <span style="font-size: 13px; color: #fff6c4;">タップ回数ごとの振動パターン設定 (「タップ数: 振動時間(ms),休止(ms)...」):</span>
          <textarea id="vibratePatterns" style="width: 100%; height: 130px; font-family: monospace; background: #15110a; color: #fff; border: 1px solid #886f2f; border-radius: 6px; padding: 8px; font-size: 13px; line-height: 1.5; resize: vertical;">1: 10
2: 10,10
3: 20,30
4: 20,20,20
5: 30,40
6: 30,30,30</textarea>
          <span class="small" style="color: var(--text-secondary); opacity: 0.7; font-size: 11px;">※ 偶数個（例: 10,10）の場合、API仕様により「10ms振動、10ms静止」の1回振動となります。複数回振動させる場合は「10,10,10」のように奇数個にしてください。</span>
        </label>
      </div>
    </section>

    <section class="screen" aria-label="animation screen">
      <div class="base-reels">
        <div class="reel">7</div>
        <div class="reel">7</div>
        <div class="reel">7</div>
      </div>

      <div class="layer fruit-pattern" data-key="fruit">
        <div class="fruit-banner">FRUIT 柄 出現 ?!</div>
      </div>
      <div class="layer zawa-layer" data-key="zawa">
        <div class="zawa-text z1">ざわ</div>
        <div class="zawa-text z2">ざわ…</div>
        <div class="zawa-text z3">ざわざわ！</div>
      </div>
      <div class="layer gekiatsu-layer" data-key="gekiatsu">
        <div class="gekiatsu-text">激アツ</div>
      </div>
      <div class="layer chance-text" data-key="chance">CHANCE</div>
      <div class="layer rainbow-win" data-key="rainbow">BONUS確定</div>
      <div class="layer flash-layer" data-key="flash"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>

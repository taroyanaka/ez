<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tap Animation Test</title>
  <style>
    :root {
      --bg-a: #150707;
      --bg-b: #040409;
      --gold: #ffd55a;
      --red: #ff3b3b;
      --cyan: #44eaff;
      --purple: #7f4dff;
      --screen-w: min(92vw, 920px);
      --screen-h: calc(var(--screen-w) * 0.56);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(1200px 800px at 20% 20%, #2b0d0d 0%, transparent 45%),
        radial-gradient(900px 700px at 80% 80%, #0c1f3f 0%, transparent 45%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b));
      color: #f6f2e7;
      font-family: "Impact", "Arial Black", "Hiragino Kaku Gothic ProN", sans-serif;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .app {
      width: min(100%, 980px);
      display: grid;
      gap: 14px;
    }
    .panel {
      border: 2px solid #7d6529;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(28, 17, 7, 0.95), rgba(6, 6, 10, 0.95));
      padding: 14px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
    }
    .label {
      font-size: 13px;
      letter-spacing: 0.6px;
      opacity: 0.9;
    }
    .value {
      color: var(--gold);
      margin-left: 6px;
    }
    .small {
      font-size: 12px;
      opacity: 0.85;
    }
    .counter {
      font-size: 26px;
      color: #fff6c4;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.7);
      letter-spacing: 1px;
    }
    .tap-btn {
      appearance: none;
      border: 2px solid #d8a700;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 18px;
      cursor: pointer;
      color: #1a1300;
      background: linear-gradient(180deg, #ffe480, #ffc739);
      min-width: 180px;
      transition: transform 0.08s ease-out;
    }
    .tap-btn:active {
      transform: scale(0.97);
    }
    .num {
      width: 86px;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #886f2f;
      background: #15110a;
      color: #fff;
      font-size: 14px;
    }
    .checks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .checks label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      padding: 8px;
      border: 1px solid #5a4a1f;
      border-radius: 6px;
      background: rgba(21, 17, 10, 0.75);
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <section class="screen" aria-label="animation screen">
      <div class="base-reels">
        <div class="reel">7</div>
        <div class="reel">7</div>
        <div class="reel">7</div>
      </div>

      <div class="layer fruit-pattern" data-key="fruit">
        <div class="fruit-banner">FRUIT 柄 出現 ?!</div>
      </div>
      <div class="layer zawa-layer" data-key="zawa">
        <div class="zawa-text z1">ざわ</div>
        <div class="zawa-text z2">ざわ…</div>
        <div class="zawa-text z3">ざわざわ！</div>
      </div>
      <div class="layer gekiatsu-layer" data-key="gekiatsu">
        <div class="gekiatsu-text">激アツ</div>
      </div>
      <div class="layer chance-text" data-key="chance">CHANCE</div>
      <div class="layer rainbow-win" data-key="rainbow">BONUS確定</div>
      <div class="layer flash-layer" data-key="flash"></div>
    </section>

    <section class="panel">
      <div class="row" style="justify-content: space-between;">
        <div class="counter">TAP <span id="tapCount">0</span></div>
        <button class="tap-btn" id="tapButton" type="button">TAP / 連打</button>
      </div>
      <div class="row" style="margin-top: 10px;">
        <label class="label" for="tapStep">nタップ毎に1アニメ追加:
          <input id="tapStep" class="num" type="number" min="1" value="10">
        </label>
        <button class="tap-btn" id="resetButton" type="button" style="min-width: 120px;">RESET</button>
        <span class="small">有効アニメ数: <span class="value" id="activeCount">0</span></span>
      </div>
      <div class="checks" id="checks"></div>

      <div class="row" style="margin-top: 15px; border-top: 1px solid #5a4a1f; padding-top: 15px;">
        <label class="label" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" id="vibrateEnabled" checked style="width: 18px; height: 18px; cursor: pointer;">
          <span style="font-size: 14px; font-weight: bold; color: var(--gold);">バイブレーション (スマホ振動) を有効にする</span>
        </label>
      </div>

      <div class="row" style="margin-top: 10px;" id="vibrateConfigRow">
        <label class="label" style="display: flex; flex-direction: column; gap: 6px; width: 100%;">
          <span style="font-size: 13px; color: #fff6c4;">タップ回数ごとの振動パターン設定 (「タップ数: 振動時間(ms),休止(ms)...」):</span>
          <textarea id="vibratePatterns" style="width: 100%; height: 160px; font-family: monospace; background: #15110a; color: #fff; border: 1px solid #886f2f; border-radius: 6px; padding: 8px; font-size: 13px; line-height: 1.5; resize: vertical;">1: 10
2: 100,10,100
3: 200,10,200
4: 300,10,300,10,300,10,300
5: 400,10,400,10,400,10,400
6: 500,10,500,10,500,10,500,10,500,10,500
7: 600,10,600,10,600,10,600,10,600,10,600
8: 700,10,700,10,700,10,700,10,700,10,700,10,700,10,700
9: 800,10,800,10,800,10,800,10,800,10,800,10,800,10,800
10: 900,10,900,10,900,10,900,10,900,10,900,10,900,10,900,10,900,10,900
11: 1000,10,1000,10,1000,10,1000,10,1000,10,1000,10,1000,10,1000,10,1000,10,1000
12: 1100,10,1100,10,1100,10,1100,10,1100,10,1100,10,1100,10,1100,10,1100,10,1100,10,1100,10,1100
13: 1200,10,1200,10,1200,10,1200,10,1200,10,1200,10,1200,10,1200,10,1200,10,1200,10,1200,10,1200
14: 1300,10,1300,10,1300,10,1300,10,1300,10,1300,10,1300,10,1300,10,1300,10,1300,10,1300,10,1300,10,1300,10,1300
15: 1400,10,1400,10,1400,10,1400,10,1400,10,1400,10,1400,10,1400,10,1400,10,1400,10,1400,10,1400,10,1400,10,1400
16: 1500,10,1500,10,1500,10,1500,10,1500,10,1500,10,1500,10,1500,10,1500,10,1500,10,1500,10,1500,10,1500,10,1500,10,1500,10,1500
17: 1600,10,1600,10,1600,10,1600,10,1600,10,1600,10,1600,10,1600,10,1600,10,1600,10,1600,10,1600,10,1600,10,1600,10,1600,10,1600
18: 1700,10,1700,10,1700,10,1700,10,1700,10,1700,10,1700,10,1700,10,1700,10,1700,10,1700,10,1700,10,1700,10,1700,10,1700,10,1700,10,1700,10,1700</textarea>
          <span class="small" style="color: var(--text-secondary); opacity: 0.7; font-size: 11px;">※ 偶数個（例: 10,10）の場合、API仕様により「10ms振動、10ms静止」の1回振動となります。複数回振動させる場合は「10,10,10」のように奇数個にしてください。</span>
        </label>
      </div>
    </section>

    <!-- Tap Race Battle Section -->
    <section class="panel" style="text-align: center; margin-top: 20px;">
      <h2 style="color: #ffd700; margin-bottom: 10px;">5秒タップ競争 (Test)</h2>
      
      <!-- Start for everyone / 全員分を一斉に開始 -->
      <button class="tap-btn" id="startBtn" onclick="send('START')" style="padding: 10px 20px; font-size: 14px;">
        Start for All / 全員で開始
      </button>
      
      <hr style="margin: 20px 0; border-color: #5a4a1f;">
      
      <!-- Main Tap Button / 連打用ボタン -->
      <button class="tap-btn" id="battleTapBtn" onclick="send('TAP')" disabled 
              style="padding: 30px; font-size: 1.5em; width: 80%; max-width: 300px; cursor: pointer;">
        BATTLE TAP!!
      </button>

      <h3 id="status" style="color: #fff; margin-top: 15px;">Waiting... / 待機中</h3>
      <div id="results" style="white-space: pre-wrap; font-size: 1.1em; line-height: 1.6; color: #fff6c4; margin-top: 10px; text-align: left; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 4px; min-height: 50px;"></div>
    </section>
  </div>

  <script src="app.js"></script>
  <script>
    // --- UPDATED CONNECTION / 接続先を更新 ---
    const ws = new WebSocket('wss://ez-server-d7h7.onrender.com');
    
    const startBtn = document.getElementById('startBtn');
    const battleTapBtn = document.getElementById('battleTapBtn');
    const status = document.getElementById('status');
    const resultsDiv = document.getElementById('results');

    // Utility to send JSON / JSON送信用の共通関数
    function send(type) { 
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type })); 
      }
    }

    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);

      // Triggered when server broadcasts start / サーバーが開始を放送した時
      if (msg.type === 'START_GAME') {
        startBtn.disabled = true;
        battleTapBtn.disabled = false;
        status.innerText = "GO!! / 連打しろ！！";
        resultsDiv.innerText = "";
        battleTapBtn.focus();
      } 
      
      // Triggered when server sends results / サーバーが結果を送信した時
      if (msg.type === 'END_GAME') {
        battleTapBtn.disabled = true;
        startBtn.disabled = false;
        status.innerText = "Finish! / 終了！";
        resultsDiv.innerText = "--- Rankings ---\n" + msg.results.join('\n');
      }
    };

    ws.onopen = () => console.log("Connected to Render server / Renderサーバーに接続しました");
    ws.onclose = () => alert("Connection lost / 接続が切れました");
    ws.onerror = (err) => console.error("WebSocket Error:", err);
  </script>
</body>
</html>

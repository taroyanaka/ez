<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Only Up Clone - Instakill & Overhead UI</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        #ui-layer { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); font-size: 20px; pointer-events: none; display: flex; flex-direction: column; gap: 5px; z-index: 20; }
        #height-display { font-size: 28px; font-weight: bold; }
        #jump-display { font-size: 18px; color: #00e676; font-weight: bold; }
        #punch-display { font-size: 18px; color: #ff9800; font-weight: bold; }
        #game-status { font-size: 32px; font-weight: bold; color: #ffeb3b; background-color: rgba(0,0,0,0.4); padding: 10px; border-radius: 5px; }
        #mode-toggle-btn { margin-top: 10px; padding: 10px 20px; font-size: 16px; font-weight: bold; background-color: #e91e63; color: white; border: none; border-radius: 5px; cursor: pointer; pointer-events: auto; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); width: 150px; }
        #mode-toggle-btn.auto-mode { background-color: #00e676; color: #333; }
        #leaderboard { position: absolute; top: 10px; right: 10px; width: 240px; max-height: 45vh; background-color: rgba(0,0,0,0.6); color: white; padding: 10px; border-radius: 5px; font-size: 12px; overflow-y: auto; z-index: 20; pointer-events: none; }
        #leaderboard h3 { margin: 0 0 5px 0; font-size: 14px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 3px; color: #ffeb3b; }
        .rank-item { display: flex; justify-content: space-between; margin: 3px 0; align-items: center; }
        .rank-item.player-row { color: #ff4081; font-weight: bold; background-color: rgba(255,255,255,0.2); border-radius: 2px; padding: 1px 4px; }
        .jump-count { color: #00e676; margin-left: 5px; }
        .jump-count.locked { color: #ff1744; font-weight: bold; }
        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; z-index: 10; }
        #punch-touch-zone { position: absolute; top: 0; left: 0; width: 50vw; height: 100vh; z-index: 5; }
        #jump-touch-zone { position: absolute; top: 0; right: 0; width: 50vw; height: 100vh; z-index: 5; }
        
        /* 頭上UI（HTMLオーバーレイ）用スタイル */
        .overhead-label { position: absolute; color: white; font-weight: bold; font-size: 12px; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); pointer-events: none; transform: translate(-50%, -100%); white-space: nowrap; z-index: 10; transition: opacity 0.1s; }
        .overhead-label.player-label { background: rgba(233, 30, 99, 0.75); border-color: #ff4081; font-size: 14px; }
    </style>
    <script src="libs/three.min.js"></script>
    <script src="libs/nipplejs.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div id="height-display">Height: 0m</div>
        <div id="jump-display">Max Jumps: 2</div>
        <div id="punch-display">PUNCH: READY</div>
        <div id="game-status"></div>
        <button id="mode-toggle-btn" onclick="toggleMode()">MODE: MANUAL</button>
    </div>

    <div id="leaderboard">
        <h3>🏆 LEADERBOARD (JUMPS)</h3>
        <div id="rank-list"></div>
    </div>
    
    <div id="overhead-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 9;"></div>

    <div id="joystick-zone"></div>
    <div id="punch-touch-zone"></div>
    <div id="jump-touch-zone"></div>
    <div id="canvas-container"></div>

    <script>
        // --- 設定 ---
        const PLAYER_SPEED = 0.12; 
        const JUMP_FORCE = 0.375; 
        const GRAVITY = 0.0098;
        const TOTAL_TILES = 8;        // 【変更】ゴールタイルを8枚目に短縮
        const PUNCH_COOLDOWN = 2000;  // 【変更】パンチのリチャージを2秒（2000ms）に変更
        const PUNCH_RANGE = 3.5;     
        const KILL_WINDOW = 5000;    
        
        let scene, camera, renderer;
        let player = { id: "player", name: "PLAYER", mesh: null, radius: 1.0, height: 1.8, velocity: new THREE.Vector3(), onGround: false, maxJumps: 2, remainingJumps: 2, canJumpAfterHit: true, lastPunchTime: 0, lastHitBy: null, lastHitTime: 0, joystickInput: { x: 0, z: 0 }, domLabel: null };
        let npcs = [], platforms = [], punchVisuals = [], keyboard = {}, isAutoMode = false, isGameOver = false;
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.008); 
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 120, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // プレイヤー作成
            const playerGeo = new THREE.CylinderGeometry(player.radius, player.radius, player.height, 16);
            player.mesh = new THREE.Mesh(playerGeo, new THREE.MeshLambertMaterial({ color: 0xe91e63 }));
            player.mesh.position.set(0, player.height / 2, 0);
            player.mesh.castShadow = true;
            scene.add(player.mesh);

            // 頭上UIの作成（プレイヤー用）
            createOverheadLabel(player, true);

            createNPCs(20);
            generateStage();
            setupInputs();
            animate();
        }

        function createOverheadLabel(char, isPlayer = false) {
            const label = document.createElement('div');
            label.className = isPlayer ? 'overhead-label player-label' : 'overhead-label';
            document.getElementById('overhead-container').appendChild(label);
            char.domLabel = label;
        }

        function createNPCs(count) {
            const npcGeo = new THREE.CylinderGeometry(player.radius, player.radius, player.height, 16);
            for(let i = 0; i < count; i++) {
                const mesh = new THREE.Mesh(npcGeo, new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL((i * 0.05) % 1.0, 0.8, 0.4 + Math.random()*0.2) }));
                mesh.castShadow = true;
                mesh.position.set((Math.random()-0.5)*16, player.height/2, (Math.random()-0.5)*16);
                scene.add(mesh);
                
                let npcObj = { id: `npc_${i}`, name: `NPC ${i+1}`, mesh: mesh, radius: player.radius, height: player.height, velocity: new THREE.Vector3(), onGround: false, maxJumps: 2, remainingJumps: 2, canJumpAfterHit: true, lastPunchTime: 0, lastHitBy: null, lastHitTime: 0, stopTimer: 0, isStopped: false, domLabel: null };
                createOverheadLabel(npcObj, false);
                npcs.push(npcObj);
            }
        }

        function generateStage() {
            // 最初のスポーンタイル（初期の足場、Y=-0.5、高さ1のボックスなので上面は Y=0）
            createPlatform(0, -0.5, 0, 30, 1, 30, 0x333333, false, true); 

            let currentX = 0, currentY = 1.0, currentZ = -5;
            // 2枚目から7枚目までの通常タイル
            for (let i = 1; i < TOTAL_TILES - 1; i++) {
                let baseScale = ((1.5 + Math.random() * 0.5) * 3.0) * 0.5 * Math.pow(1.1, i);
                currentX += ((Math.random() - 0.5) * 5) * baseScale;
                currentY += ((Math.random() * 1.3 + 1.1) * 0.5) * baseScale; 
                currentZ += ((Math.random() - 0.5) * 5 - 3) * baseScale;
                createPlatform(currentX, currentY, currentZ, 7, 0.4, 7, 0x4caf50, false, false);
            }
            // 8枚目のゴールタイル
            let baseScale = ((1.5 + Math.random() * 0.5) * 3.0) * 0.5 * Math.pow(1.1, TOTAL_TILES - 1);
            currentX += ((Math.random() - 0.5) * 5) * baseScale;
            currentY += ((Math.random() * 1.3 + 1.1) * 0.5) * baseScale; 
            currentZ += ((Math.random() - 0.5) * 5 - 3) * baseScale;
            createPlatform(currentX, currentY + 2, currentZ - 5, 15, 0.5, 15, 0xffd700, true, false);
        }

        function createPlatform(x, y, z, w, h, d, color, isGoal, isSpawnTile = false) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color }));
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            scene.add(mesh);
            platforms.push({ mesh, center: new THREE.Vector3(x, y, z), min: new THREE.Vector3(x-w/2, y-h/2, z-d/2), max: new THREE.Vector3(x+w/2, y+h/2, z+d/2), isGoal, isSpawnTile });
        }

        // キャラクターが最初のスポーンタイル（安全地帯）にいるか判定する関数
        function isInSpawnSafeZone(char) {
            if (!char.mesh) return false;
            // 高さの判定（最初のタイル上面は Y=0 なので、乗っている時は足元がほぼ0）
            let footY = char.mesh.position.y - char.height / 2;
            if (footY > 0.5) return false; 

            // 最初のタイルの範囲内に入っているかチェック
            let spawnPlat = platforms.find(p => p.isSpawnTile);
            if (!spawnPlat) return false;

            let pos = char.mesh.position;
            return (pos.x >= spawnPlat.min.x && pos.x <= spawnPlat.max.x &&
                    pos.z >= spawnPlat.min.z && pos.z <= spawnPlat.max.z);
        }

        function execute4WayPunch(attacker) {
            if (isGameOver) return;
            
            // 【変更】スポーンした最初の位置のタイルにいる時はパンチ不可
            if (isInSpawnSafeZone(attacker)) return;

            const now = performance.now();
            if (now - attacker.lastPunchTime < PUNCH_COOLDOWN) return; 
            attacker.lastPunchTime = now;
            createPunchVisual(attacker.mesh.position);

            const allChars = [player, ...npcs];
            allChars.forEach(target => {
                if (target.id === attacker.id) return; 
                
                // 【変更】相手が最初のスポーンタイルにいる場合も即死パンチは無効
                if (isInSpawnSafeZone(target)) return;

                let dist = attacker.mesh.position.distanceTo(target.mesh.position);
                if (dist < PUNCH_RANGE) {
                    target.lastHitBy = attacker.id;
                    target.lastHitTime = now;
                    
                    // 【変更】吹っ飛ぶのではなく即死（一瞬で奈落 y = -41 へワープ）
                    target.mesh.position.y = -41;
                    target.velocity.set(0, -10, 0); 
                }
            });
        }

        function tryJump(char) {
            if (!char.canJumpAfterHit || isGameOver) return;
            if (char.onGround) {
                char.velocity.y = JUMP_FORCE;
                char.onGround = false;
                char.remainingJumps = char.maxJumps - 1; 
            } else if (char.remainingJumps > 0) {
                char.velocity.y = JUMP_FORCE;
                char.remainingJumps--; 
            }
        }

        function calculateAIMovement(npc) {
            if (isGameOver) return;
            checkNPCPunchTrigger(npc);
            npc.stopTimer--;
            if (npc.stopTimer <= 0) {
                npc.isStopped = Math.random() < 0.3;
                npc.stopTimer = Math.random() * 60 + 30;
            }
            if (npc.isStopped) return;

            let target = platforms.find(p => p.center.y > npc.mesh.position.y + 0.1);
            if (!target) return;
            let diff = new THREE.Vector3().subVectors(target.center, npc.mesh.position);
            let distXZ = Math.sqrt(diff.x**2 + diff.z**2);
            if (distXZ > 0.1) {
                npc.velocity.x = THREE.MathUtils.lerp(npc.velocity.x, (diff.x/distXZ) * PLAYER_SPEED, 0.1);
                npc.velocity.z = THREE.MathUtils.lerp(npc.velocity.z, (diff.z/distXZ) * PLAYER_SPEED, 0.1);
            }
            if (distXZ < 20.0 && npc.velocity.y < -0.05) tryJump(npc); 
        }

        function setupInputs() {
            window.addEventListener('keydown', (e) => {
                if (e.repeat) return; 
                keyboard[e.code] = true;
                if (e.code === 'Space' && !isAutoMode) tryJump(player);
                if (e.code === 'KeyF' && !isAutoMode) execute4WayPunch(player);
            });
            window.addEventListener('keyup', (e) => keyboard[e.code] = false);
            
            nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: { left: '75px', bottom: '75px' } }).on('move', (evt, data) => {
                if (!isAutoMode) {
                    player.joystickInput.x = Math.cos(data.angle.radial) * (data.distance/50);
                    player.joystickInput.z = -Math.sin(data.angle.radial) * (data.distance/50);
                }
            }).on('end', () => { player.joystickInput.x = 0; player.joystickInput.z = 0; });
            
            document.getElementById('jump-touch-zone').addEventListener('touchstart', (e) => { e.preventDefault(); if(!isAutoMode) tryJump(player); }, { passive: false });
            document.getElementById('punch-touch-zone').addEventListener('touchstart', (e) => { e.preventDefault(); if(!isAutoMode) execute4WayPunch(player); }, { passive: false });
        }

        function updateCharacterPhysics(char, isNPC) {
            if (!isGameOver) {
                if (isNPC) calculateAIMovement(char);
                else if (!isAutoMode) {
                    if (keyboard['KeyW']) char.velocity.z = -PLAYER_SPEED;
                    if (keyboard['KeyS']) char.velocity.z = PLAYER_SPEED;
                    if (keyboard['KeyA']) char.velocity.x = -PLAYER_SPEED;
                    if (keyboard['KeyD']) char.velocity.x = PLAYER_SPEED;
                    if (char.joystickInput.x !== 0) { char.velocity.x = char.joystickInput.x * PLAYER_SPEED; char.velocity.z = char.joystickInput.z * PLAYER_SPEED; }
                } else { calculateAIMovement(char); }
            }
            
            char.velocity.y -= GRAVITY;
            char.mesh.position.add(char.velocity);

            // 死亡・奈落判定
            if (char.mesh.position.y < -40) {
                awardKillCredit(char);
                char.mesh.position.set((Math.random()-0.5)*15, 2, (Math.random()-0.5)*15);
                char.velocity.set(0,0,0);
                char.remainingJumps = char.maxJumps;
                char.onGround = true;
                return;
            }

            char.onGround = false;
            platforms.forEach(b => {
                if (char.mesh.position.x + char.radius > b.min.x && char.mesh.position.x - char.radius < b.max.x &&
                    char.mesh.position.z + char.radius > b.min.z && char.mesh.position.z - char.radius < b.max.z) {
                    if (char.mesh.position.y - char.height/2 <= b.max.y && char.mesh.position.y - char.height/2 > b.max.y - 0.5 && char.velocity.y <= 0) {
                        char.velocity.y = 0;
                        char.mesh.position.y = b.max.y + char.height/2;
                        char.onGround = true;
                        char.remainingJumps = char.maxJumps;
                        char.canJumpAfterHit = true;
                        if (b.isGoal && !isGameOver) { isGameOver = true; document.getElementById('game-status').innerText = `${char.name} GOAL!`; }
                    }
                }
            });
            char.velocity.x *= 0.9; char.velocity.z *= 0.9;
        }

        function handleCharacterCollisions() {
            let all = [player, ...npcs];
            for (let i = 0; i < all.length; i++) {
                for (let j = i + 1; j < all.length; j++) {
                    let c1 = all[i], c2 = all[j];
                    let dist = c1.mesh.position.distanceTo(c2.mesh.position);
                    if (dist < c1.radius + c2.radius && Math.abs(c1.mesh.position.y - c2.mesh.position.y) < 1.0) {
                        let push = new THREE.Vector3().subVectors(c2.mesh.position, c1.mesh.position).normalize().multiplyScalar(0.05);
                        c1.mesh.position.sub(push);
                        c2.mesh.position.add(push);
                    }
                }
            }
        }

        function awardKillCredit(deadChar) {
            if (deadChar.lastHitBy && (performance.now() - deadChar.lastHitTime < KILL_WINDOW)) {
                let killer = [player, ...npcs].find(c => c.id === deadChar.lastHitBy);
                if (killer) {
                    killer.maxJumps += 2; 
                    if (killer.id === "player") {
                        document.getElementById('game-status').innerText = `🎯 INSTAKILL! MAX JUMPS: +2 (${killer.maxJumps})`;
                        setTimeout(() => { document.getElementById('game-status').innerText = ""; }, 2000);
                    }
                }
            }
            deadChar.lastHitBy = null;
        }

        function createPunchVisual(pos) {
            const v = new THREE.Mesh(new THREE.RingGeometry(0, PUNCH_RANGE, 32), new THREE.MeshBasicMaterial({ color: 0xff1744, transparent: true, opacity: 0.5, side: THREE.DoubleSide }));
            v.rotation.x = Math.PI/2; v.position.copy(pos); v.position.y -= 0.5;
            scene.add(v);
            punchVisuals.push({ mesh: v, time: performance.now() });
        }

        // 【追加】頭上UIの位置投影とテキスト更新処理
        function updateOverheadLabels() {
            const all = [player, ...npcs];
            const tempV = new THREE.Vector3();

            all.forEach(char => {
                if (!char.domLabel || !char.mesh) return;

                // キャラクターの少し上にUIの3D座標を設定
                tempV.copy(char.mesh.position);
                tempV.y += char.height / 2 + 0.6; 

                // 3D座標を2D画面座標（スクリーン座標）に変換
                tempV.project(camera);

                // カメラの後ろにいる場合は非表示にする
                if (tempV.z > 1) {
                    char.domLabel.style.opacity = 0;
                    return;
                }

                char.domLabel.style.opacity = 1;
                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                char.domLabel.style.left = `${x}px`;
                char.domLabel.style.top = `${y}px`;

                // テキスト内容を「名前 [残り回数/最大数]」に更新
                char.domLabel.innerHTML = `${char.name} <span style="color:#00e676;">[${char.remainingJumps}/${char.maxJumps}]</span>`;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            updateCharacterPhysics(player, false);
            npcs.forEach(n => updateCharacterPhysics(n, true));
            handleCharacterCollisions();
            
            punchVisuals.forEach((v, i) => { if(performance.now() - v.time > 200) { scene.remove(v.mesh); punchVisuals.splice(i,1); } });
            
            camera.position.set(player.mesh.position.x, player.mesh.position.y + 10, player.mesh.position.z + 20);
            camera.lookAt(player.mesh.position);
            renderer.render(scene, camera);

            // 頭上UIの更新
            updateOverheadLabels();

            // 左側UI・リーダーボード更新
            let now = performance.now();
            let list = [player, ...npcs].sort((a,b) => b.mesh.position.y - a.mesh.position.y);
            document.getElementById('rank-list').innerHTML = list.map((c, i) => `
                <div class="${c.id==='player'?'rank-item player-row':'rank-item'}">
                    <span>${i+1}. ${c.name} <span class="jump-count">[${c.remainingJumps}/${c.maxJumps}]</span></span>
                    <span>${Math.max(0, Math.floor(c.mesh.position.y))}m</span>
                </div>`).join('');
                
            document.getElementById('height-display').innerText = `Height: ${Math.max(0, Math.floor(player.mesh.position.y))}m`;
            document.getElementById('jump-display').innerText = `Jumps: ${player.remainingJumps}/${player.maxJumps}`;
            
            if (isInSpawnSafeZone(player)) {
                document.getElementById('punch-display').innerText = `PUNCH: SAFE ZONE (DISABLED)`;
                document.getElementById('punch-display').style.color = '#ffeb3b';
            } else {
                let punchTimeDiff = now - player.lastPunchTime;
                if (punchTimeDiff < PUNCH_COOLDOWN) {
                    let remainingCd = ((PUNCH_COOLDOWN - punchTimeDiff) / 1000).toFixed(1);
                    document.getElementById('punch-display').innerText = `PUNCH: RECHARGING (${remainingCd}s)`;
                    document.getElementById('punch-display').style.color = '#ff5722';
                } else {
                    document.getElementById('punch-display').innerText = `PUNCH: READY (F Key)`;
                    document.getElementById('punch-display').style.color = '#00e676';
                }
            }
        }

        function checkNPCPunchTrigger(npc) {
            if (isInSpawnSafeZone(npc)) return; // 安全地帯にいるNPCはパンチしない
            if (performance.now() - npc.lastPunchTime < PUNCH_COOLDOWN) return;
            
            let target = [player, ...npcs].find(t => t.id !== npc.id && npc.mesh.position.distanceTo(t.mesh.position) < PUNCH_RANGE - 0.5);
            if (target && !isInSpawnSafeZone(target)) execute4WayPunch(npc);
        }

        function toggleMode() { isAutoMode = !isAutoMode; document.getElementById('mode-toggle-btn').innerText = isAutoMode ? "MODE: AUTO" : "MODE: MANUAL"; }
        window.onload = init;
    </script>
</body>
</html>

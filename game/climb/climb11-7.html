<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Only Up Clone - Configurable</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        #ui-layer { position: absolute; top: 10px; left: 10px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); font-size: 14px; pointer-events: none; display: flex; flex-direction: column; gap: 3px; z-index: 20; }
        #height-display { font-size: 20px; font-weight: bold; }
        #jump-display { font-size: 14px; color: #00e676; font-weight: bold; }
        #gold-display { font-size: 14px; color: #ffd700; font-weight: bold; }
        #trap-display { font-size: 14px; color: #ff5722; font-weight: bold; }
        #speedrun-display { font-size: 14px; color: #81d4fa; font-weight: bold; }
        #game-status { font-size: 20px; font-weight: bold; color: #ffeb3b; background-color: rgba(0,0,0,0.4); padding: 5px; border-radius: 5px; margin-top: 5px; }
        #mode-toggle-btn { margin-top: 5px; padding: 5px 10px; font-size: 12px; font-weight: bold; background-color: #e91e63; color: white; border: none; border-radius: 5px; cursor: pointer; pointer-events: auto; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); width: 120px; }
        #mode-toggle-btn.auto-mode { background-color: #00e676; color: #333; }
        
        #settings-btn { margin-top: 5px; padding: 5px 10px; font-size: 12px; font-weight: bold; background-color: #3f51b5; color: white; border: none; border-radius: 5px; cursor: pointer; pointer-events: auto; box-shadow: 1px 1px 3px rgba(0,0,0,0.3); width: 120px; }
        #trap-action-btn { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); padding: 12px 16px; font-size: 14px; font-weight: bold; background-color: #ff5722; color: white; border: none; border-radius: 10px; cursor: pointer; pointer-events: auto; box-shadow: 2px 2px 6px rgba(0,0,0,0.35); z-index: 13; min-width: 120px; }
        #trap-action-btn.disabled { background-color: #757575; }
        
        #leaderboard { position: absolute; top: 10px; right: 10px; width: 200px; max-height: 45vh; background-color: rgba(0,0,0,0.6); color: white; padding: 10px; border-radius: 5px; font-size: 12px; overflow-y: auto; z-index: 20; pointer-events: none; }
        #leaderboard h3 { margin: 0 0 5px 0; font-size: 14px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 3px; color: #ffeb3b; }
        .rank-item { display: flex; justify-content: space-between; margin: 3px 0; align-items: center; }
        .rank-item.player-row { color: #ff4081; font-weight: bold; background-color: rgba(255,255,255,0.2); border-radius: 2px; padding: 1px 4px; }
        .jump-count { color: #00e676; margin-left: 5px; }
        .gold-count { color: #ffd700; margin-left: 5px; }
        
        .overhead-label { position: absolute; color: white; font-weight: bold; font-size: 11px; background: rgba(0,0,0,0.65); padding: 4px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.25); pointer-events: none; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 3px; z-index: 10; opacity: 0; white-space: nowrap; }
        .overhead-label.player-label { background: rgba(233, 30, 99, 0.8); border-color: #ff4081; font-size: 13px; padding: 5px 8px; }
        
        @media (max-width: 768px) {
            #leaderboard { display: none; }
        }
        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; z-index: 12; }
        #jump-touch-zone { position: absolute; top: 0; right: 0; width: 50vw; height: 100vh; z-index: 8; }
        #trap-touch-zone { position: absolute; top: 0; left: 0; width: 50vw; height: 100vh; z-index: 8; }
    </style>
    <script src="libs/three.min.js"></script>
    <script src="libs/nipplejs.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div id="height-display">Height: 0m</div>
        <div id="jump-display">Max Jumps: 2</div>
        <div id="gold-display">Gold: 0</div>
        <div id="trap-display">TRAP: 1/1 (N Key)</div>
        <div id="speedrun-display">Speedrun: OFF</div>
        <div id="game-status"></div>
        <button id="mode-toggle-btn" onclick="toggleMode()">MODE: MANUAL</button>
        <button id="settings-btn" onclick="openSettings()">⚙ SETTINGS</button>
    </div>

    <div id="leaderboard">
        <h3>🏆 LEADERBOARD</h3>
        <div id="rank-list"></div>
    </div>
    
    <div id="overhead-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 9;"></div>

    <div id="joystick-zone"></div>
    <button id="trap-action-btn" onclick="handleTrapAction()">TRAP</button>
    <div id="trap-touch-zone"></div>
    <div id="jump-touch-zone"></div>
    <div id="canvas-container"></div>

    <!-- 設定モーダル -->
    <div id="settings-modal" style="display:none; position:absolute; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); z-index:100; justify-content:center; align-items:center; pointer-events:auto;">
        <div style="background:white; padding:20px; border-radius:10px; width:350px; max-height:85vh; display:flex; flex-direction:column; box-sizing:border-box; color:black; font-family:sans-serif;">
            
            <div style="display:flex; border-bottom:1px solid #ccc; margin-bottom:15px; flex-shrink:0;">
                <button id="tab-btn-settings" onclick="switchTab('settings')" style="flex:1; padding:10px; border:none; background:#eee; font-weight:bold; cursor:pointer;">Settings</button>
                <button id="tab-btn-test" onclick="switchTab('test')" style="flex:1; padding:10px; border:none; background:#fff; cursor:pointer;">Test Launcher</button>
            </div>
            
            <div style="display:flex; justify-content:space-between; gap:5px; flex-shrink:0; margin-bottom:15px;">
                <button onclick="closeSettings()" style="flex:1; padding:10px; background:#ccc; border:none; border-radius:5px; cursor:pointer;">Cancel</button>
                <button onclick="resetSettings()" style="flex:1; padding:10px; background:#ff9800; color:white; border:none; border-radius:5px; cursor:pointer;">Default</button>
                <button onclick="saveSettings()" style="flex:1.5; padding:10px; background:#e91e63; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">Save & Restart</button>
            </div>
            
            <div id="tab-content-settings" style="overflow-y:auto; flex-grow:1; margin-bottom:15px; padding-right:5px; display:block;">
                <label>NPC Count:</label><br>
                <input type="number" id="input-NPC_COUNT" min="0" step="1" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;"><br>
                
                <label>Total Tiles:</label><br>
                <input type="number" id="input-TOTAL_TILES" min="5" step="1" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;"><br>
                
                <label>Player Speed:</label><br>
                <input type="number" id="input-PLAYER_SPEED" min="0.01" step="0.01" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;"><br>
                
                <label>Jump Force:</label><br>
                <input type="number" id="input-JUMP_FORCE" min="0.1" step="0.01" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;"><br>
                
                <label>Gravity:</label><br>
                <input type="number" id="input-GRAVITY" min="0.001" step="0.001" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;"><br>
                
                <label>Trap Duration (ms):</label><br>
                <input type="number" id="input-TRAP_DURATION" min="500" step="100" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;"><br>

                <label>Trap Auto Disappear (ms):</label><br>
                <input type="number" id="input-TRAP_AUTO_DISAPPEAR_DURATION" min="500" step="100" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;"><br>

                <label>Trap Max Count:</label><br>
                <input type="number" id="input-TRAP_MAX_COUNT" min="1" step="1" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;"><br>

                <label>Trap Reload Interval (ms):</label><br>
                <input type="number" id="input-TRAP_RELOAD_INTERVAL" min="100" step="100" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;"><br>

                <label>Trap Mode:</label><br>
                <select id="input-TRAP_MODE" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;">
                    <option value="consume">Consume</option>
                    <option value="reload">Reload</option>
                </select><br>
                
                <label>Save Point Interval:</label><br>
                <input type="number" id="input-SAVE_INTERVAL" min="1" step="1" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;"><br>
                
                <label>Gold Per Kill:</label><br>
                <input type="number" id="input-GOLD_PER_KILL" min="1" step="1" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;"><br>

                <label>Shop Items:</label><br>
                <textarea id="input-SHOP_ITEMS" rows="5" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box; font-family:monospace; resize:vertical;"></textarea>
                <div style="font-size:12px; color:#555; margin-bottom:10px;">Format: `jumpBoost:cost[:hexColor]` per line, e.g. `1:10:#8bc34a`</div>

                <label>Speedrun Mode:</label><br>
                <select id="input-SPEEDRUN_MODE" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;">
                    <option value="off">Off</option>
                    <option value="on">On</option>
                </select><br>

                <label>Speedrun Limit (sec):</label><br>
                <input type="number" id="input-SPEEDRUN_LIMIT_SEC" min="1" step="1" value="180" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;"><br>

                <label>Speedrun Multiplier:</label><br>
                <input type="number" id="input-SPEEDRUN_MULTIPLIER" min="1" step="1" value="50" style="width:100%; margin-bottom:10px; padding:5px; box-sizing:border-box;"><br>
            </div>
            
            <div id="tab-content-test" style="overflow-y:auto; flex-grow:1; margin-bottom:15px; padding-right:5px; display:none;">
                <div class="test-launcher">
                    <h3 style="margin-top:0;">検証用ドッグフーディング・リンク</h3>
                    <p style="font-size:12px; color:#555;">param.txt の設定から生成されています。</p>
                    <ul id="test-links-list" style="padding-left:20px; line-height:2.0;">
                        <!-- JSで動的に追加される -->
                        <li>読み込み中...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 設定 (URL GETパラメーター優先 -> localStorage対応) ---
        function getConfig(key, defaultVal, isFloat) { 
            try {
                // 1. URL GETパラメーターを優先
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has(key)) {
                    let val = urlParams.get(key);
                    let num = isFloat ? parseFloat(val) : parseInt(val);
                    return isNaN(num) ? defaultVal : num;
                }

                // 2. localStorage
                let val = localStorage.getItem('climb_' + key);
                if (val === null) return defaultVal;
                let num = isFloat ? parseFloat(val) : parseInt(val);
                return isNaN(num) ? defaultVal : num; 
            } catch(e) { return defaultVal; }
        }

        const PLAYER_SPEED = getConfig('PLAYER_SPEED', 0.12, true);
        const JUMP_FORCE = getConfig('JUMP_FORCE', 0.375, true);
        const GRAVITY = getConfig('GRAVITY', 0.0098, true);
        const TOTAL_TILES = getConfig('TOTAL_TILES', 30, false);
        const TRAP_DURATION = getConfig('TRAP_DURATION', 1000, false);
        const TRAP_AUTO_DISAPPEAR_DURATION = getConfig('TRAP_AUTO_DISAPPEAR_DURATION', TRAP_DURATION, false);
        const TRAP_MAX_COUNT = Math.max(1, getConfig('TRAP_MAX_COUNT', 1, false));
        const TRAP_RELOAD_INTERVAL = Math.max(100, getConfig('TRAP_RELOAD_INTERVAL', 3000, false));
        const TRAP_MODE = (() => {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('TRAP_MODE')) return urlParams.get('TRAP_MODE') === 'reload' ? 'reload' : 'consume';
                const stored = localStorage.getItem('climb_TRAP_MODE');
                if (stored === 'reload' || stored === 'consume') return stored;
            } catch(e) {}
            return 'consume';
        })();
        const SAVE_INTERVAL = getConfig('SAVE_INTERVAL', 3, false);
        const GOLD_PER_KILL = getConfig('GOLD_PER_KILL', 10, false);
        const NPC_COUNT = Math.max(0, getConfig('NPC_COUNT', 10, false));
        const SPEEDRUN_MODE = (() => {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('SPEEDRUN_MODE')) {
                    const val = urlParams.get('SPEEDRUN_MODE');
                    return val === '1' || val === 'true' || val === 'on' || val === 'yes';
                }
                const stored = localStorage.getItem('climb_SPEEDRUN_MODE');
                if (stored) return stored === '1' || stored === 'true' || stored === 'on' || stored === 'yes';
            } catch(e) {}
            return false;
        })();
        const SPEEDRUN_LIMIT_SEC = Math.max(1, getConfig('SPEEDRUN_LIMIT_SEC', 180, false));
        const SPEEDRUN_MULTIPLIER = Math.max(1, getConfig('SPEEDRUN_MULTIPLIER', 50, false));
        const DEFAULT_SHOP_ITEMS = [
            { jumpBoost: 1, cost: 10, color: 0x8bc34a },
            { jumpBoost: 2, cost: 20, color: 0x0288d1 },
            { jumpBoost: 3, cost: 30, color: 0x7b1fa2 }
        ];

        function parseShopItems(text) {
            if (!text) return DEFAULT_SHOP_ITEMS.slice();
            const lines = String(text).split(/\r?\n|\|/).map(v => v.trim()).filter(Boolean);
            const items = lines.map(line => {
                const parts = line.split(':').map(v => v.trim());
                const jumpBoost = parseFloat(parts[0]);
                const cost = parseFloat(parts[1]);
                const color = parts[2] ? parseInt(parts[2].replace(/^#/, ''), 16) : 0x8bc34a;
                if (!Number.isFinite(jumpBoost) || !Number.isFinite(cost)) return null;
                return { jumpBoost, cost, color: Number.isFinite(color) ? color : 0x8bc34a };
            }).filter(Boolean);
            return items.length ? items : DEFAULT_SHOP_ITEMS.slice();
        }

        function encodeShopItems(items) {
            return items.map(item => `${item.jumpBoost}:${item.cost}:${`#${item.color.toString(16).padStart(6, '0')}`}`).join('\n');
        }

        const SHOP_ITEMS = (() => {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('SHOP_ITEMS')) return parseShopItems(decodeURIComponent(urlParams.get('SHOP_ITEMS')));
                const stored = localStorage.getItem('climb_SHOP_ITEMS');
                if (stored) return parseShopItems(stored);
            } catch(e) {}
            return DEFAULT_SHOP_ITEMS.slice();
        })();
        const AUTO_MODE = (() => {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.has('AUTO_MODE')) {
                    const val = urlParams.get('AUTO_MODE');
                    return val === '1' || val === 'true' || val === 'on';
                }
                const stored = localStorage.getItem('climb_AUTO_MODE');
                if (stored) return stored === '1' || stored === 'true' || stored === 'on';
            } catch(e) {}
            return false;
        })();
        
        let scene, camera, renderer;
        let player = { 
            id: "player", name: "PLAYER", mesh: null, radius: 1.0, height: 1.8, velocity: new THREE.Vector3(), 
            onGround: false, currentPlatform: null, maxJumps: 2, remainingJumps: 2, canJumpAfterHit: true, 
            traps: TRAP_MAX_COUNT, trapMax: TRAP_MAX_COUNT, trapReloadTimer: 0, gold: 0, respawnPos: new THREE.Vector3(), lastShopTime: 0, stopTimer: 0, isStopped: false,
            joystickInput: { x: 0, z: 0 }, domLabel: null 
        };
        let npcs = [], platforms = [], shopObjects = [], particles = [], keyboard = {}, prevKeyboard = {}, isAutoMode = AUTO_MODE, isGameOver = false;
        let speedrunState = {
            active: SPEEDRUN_MODE,
            startTime: 0,
            realElapsedMs: 0,
            gameElapsedMs: 0,
            lastUpdate: 0,
            finished: false,
            success: false,
            winner: null,
            limitSec: SPEEDRUN_LIMIT_SEC,
            multiplier: SPEEDRUN_MULTIPLIER
        };
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.008); 
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 120, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const playerGeo = new THREE.CylinderGeometry(player.radius, player.radius, player.height, 16);
            player.mesh = new THREE.Mesh(playerGeo, new THREE.MeshLambertMaterial({ color: 0xe91e63 }));
            player.mesh.position.set(0, player.height / 2, 0);
            player.mesh.castShadow = true;
            scene.add(player.mesh);

            player.onGround = true;
            player.remainingJumps = player.maxJumps;
            player.respawnPos.set(0, 2, 0);
            speedrunState.startTime = performance.now();
            speedrunState.lastUpdate = speedrunState.startTime;

            createOverheadLabel(player, true);
            createNPCs(NPC_COUNT);
            generateStage();
            setupInputs();
            document.getElementById('mode-toggle-btn').innerText = isAutoMode ? "MODE: AUTO" : "MODE: MANUAL";
            updateTrapDisplay();
            loadTestLauncher(); // ドッグフーディング用リンクの読み込み
            animate();
        }

        function createOverheadLabel(char, isPlayer = false) {
            const label = document.createElement('div');
            label.className = isPlayer ? 'overhead-label player-label' : 'overhead-label';
            
            const infoText = document.createElement('div');
            infoText.className = 'char-info-text';
            label.appendChild(infoText);

            document.getElementById('overhead-container').appendChild(label);
            
            char.domLabel = label;
            char.domInfoText = infoText;
        }

        function createShopLabel(shop) {
            const label = document.createElement('div');
            label.className = 'overhead-label';
            label.style.background = 'rgba(0, 96, 100, 0.8)';
            label.style.borderColor = '#4dd0e1';

            const nameText = document.createElement('div');
            nameText.className = 'shop-name-text';
            nameText.style.color = '#ffffff';
            nameText.textContent = `JUMP +${shop.jumpBoost}`;

            const detailText = document.createElement('div');
            detailText.className = 'shop-detail-text';
            detailText.style.color = '#ffd54f';
            detailText.textContent = `PRICE: ${shop.cost}G`;

            label.appendChild(nameText);
            label.appendChild(detailText);
            document.getElementById('overhead-container').appendChild(label);

            shop.domLabel = label;
            shop.domNameText = nameText;
            shop.domDetailText = detailText;
        }

        function createNPCs(count) {
            if (count <= 0) return;
            const npcGeo = new THREE.CylinderGeometry(player.radius, player.radius, player.height, 16);
            for(let i = 0; i < count; i++) {
                const mesh = new THREE.Mesh(npcGeo, new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL((i * 0.05) % 1.0, 0.8, 0.4 + Math.random()*0.2) }));
                mesh.castShadow = true;
                mesh.position.set((Math.random()-0.5)*16, player.height/2, (Math.random()-0.5)*16);
                scene.add(mesh);
                
                let npcObj = { 
                    id: `npc_${i}`, name: `NPC ${i+1}`, mesh: mesh, radius: player.radius, height: player.height, velocity: new THREE.Vector3(), 
                    onGround: false, currentPlatform: null, maxJumps: 2, remainingJumps: 2, canJumpAfterHit: true, 
                    traps: TRAP_MAX_COUNT, trapMax: TRAP_MAX_COUNT, trapReloadTimer: 0, gold: 0, respawnPos: new THREE.Vector3(mesh.position.x, 2, mesh.position.z), lastShopTime: 0,
                    stopTimer: 0, isStopped: false, domLabel: null 
                };
                createOverheadLabel(npcObj, false);
                npcs.push(npcObj);
            }
        }

        function createShopObject(x, y, z, jumpBoost, cost, color) {
            const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const mat = new THREE.MeshLambertMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            const shop = { mesh, jumpBoost, cost, active: true, domLabel: null, domNameText: null, domDetailText: null };
            createShopLabel(shop);
            shopObjects.push(shop);
        }

        function getBestAffordableShop(char) {
            const nearbyShops = shopObjects.filter(shop => shop.active && shop.mesh && char.mesh.position.distanceTo(shop.mesh.position) < 2.0);
            if (!nearbyShops.length) return null;
            return nearbyShops
                .filter(shop => char.gold >= shop.cost)
                .sort((a, b) => (b.jumpBoost - a.jumpBoost) || (a.cost - b.cost))[0] || null;
        }

        function purchaseShopItem(char, shop, now) {
            if (!shop || !shop.active) return false;
            if (now - char.lastShopTime <= 1000) return false;
            if (char.gold < shop.cost) return false;

            char.gold -= shop.cost;
            char.maxJumps += shop.jumpBoost;
            char.remainingJumps = Math.max(char.remainingJumps, char.maxJumps);
            char.lastShopTime = now;

            if (char.id === "player") {
                document.getElementById('game-status').innerText = `將 BOUGHT +${shop.jumpBoost} JUMPS!`;
                setTimeout(() => { document.getElementById('game-status').innerText = ""; }, 2000);
            }
            return true;
        }

        function finishSpeedrun(success, winnerName = '') {
            if (speedrunState.finished) return;
            speedrunState.finished = true;
            speedrunState.success = success;
            isGameOver = true;

            const realSec = speedrunState.realElapsedMs / 1000;
            const gameSec = speedrunState.gameElapsedMs / 1000;
            const limitText = `${speedrunState.limitSec}s`;
            const resultText = success
                ? `SUCCESS: ${winnerName} GOAL in ${realSec.toFixed(2)}s real / ${gameSec.toFixed(2)}s game`
                : `FAIL: No NPC reached goal within ${limitText}`;
            document.getElementById('game-status').innerText = resultText;
            document.getElementById('speedrun-display').innerText = success
                ? `Speedrun: SUCCESS ${realSec.toFixed(2)}s real`
                : `Speedrun: FAIL after ${realSec.toFixed(2)}s real`;
        }

        function updateSpeedrunTimer(now) {
            if (!speedrunState.active || speedrunState.finished) return;
            const delta = now - speedrunState.lastUpdate;
            speedrunState.lastUpdate = now;
            speedrunState.realElapsedMs += delta;
            speedrunState.gameElapsedMs += delta * speedrunState.multiplier;

            const realSec = speedrunState.realElapsedMs / 1000;
            const gameSec = speedrunState.gameElapsedMs / 1000;
            const remaining = Math.max(0, speedrunState.limitSec - realSec);
            document.getElementById('speedrun-display').innerText =
                `Speedrun x${speedrunState.multiplier}: ${realSec.toFixed(2)}s real / ${gameSec.toFixed(2)}s game, limit ${speedrunState.limitSec}s, remain ${remaining.toFixed(2)}s`;

            if (realSec >= speedrunState.limitSec) {
                finishSpeedrun(false);
            }
        }

        function generateStage() {
            createPlatform(0, -0.5, 0, 30, 1, 30, 0x333333, false, true, 'normal'); 
            let currentX = 0, currentY = 1.0, currentZ = -5;
            let tileTypes = ['normal', 'disappearing', 'moving_v', 'moving_h'];
            
            for (let i = 1; i < TOTAL_TILES - 1; i++) {
                let baseScale = ((1.5 + Math.random() * 0.5) * 3.0) * 0.5 * Math.pow(1.05, i);
                currentX += ((Math.random() - 0.5) * 5) * baseScale;
                currentY += ((Math.random() * 1.3 + 1.1) * 0.5) * baseScale; 
                currentZ += ((Math.random() - 0.5) * 5 - 3) * baseScale;
                
                let type = 'normal';
                if (i > 2) {
                    type = tileTypes[Math.floor(Math.random() * tileTypes.length)];
                }
                
                let typeConfig = {};
                let color = 0x4caf50;
                
                if (type === 'disappearing') {
                    typeConfig = { hideDuration: 3000, showDuration: 7000, timer: Math.random() * 10000 };
                    color = 0x9c27b0;
                } else if (type === 'moving_v') {
                    typeConfig = { speed: 1.0 + Math.random() * 1.0, range: 2 + Math.random() * 2, originY: currentY, phase: Math.random() * Math.PI * 2 };
                    color = 0x03a9f4;
                } else if (type === 'moving_h') {
                    typeConfig = { speed: 1.0 + Math.random() * 1.0, range: 3 + Math.random() * 3, originX: currentX, phase: Math.random() * Math.PI * 2 };
                    color = 0xff9800;
                }
                
                createPlatform(currentX, currentY, currentZ, 7, 0.4, 7, color, false, false, type, typeConfig);
                
                // 別ルート：セーブポイントとショップ
                if (i % SAVE_INTERVAL === 0 && i > 0) {
                    let branchX = currentX + 12 * (Math.random() > 0.5 ? 1 : -1);
                    createPlatform(branchX, currentY, currentZ, 12, 0.5, 12, 0x00bcd4, false, false, 'savepoint');
                    // ショップオブジェクト (ジャンプ増加 +1, +2, +3)
                    const spacing = 3;
                    const startX = branchX - spacing * (SHOP_ITEMS.length - 1) / 2;
                    SHOP_ITEMS.forEach((item, idx) => {
                        createShopObject(startX + idx * spacing, currentY + 1.5, currentZ, item.jumpBoost, item.cost, item.color);
                    });
                }
            }
            if (TOTAL_TILES > 1) {
                let baseScale = ((1.5 + Math.random() * 0.5) * 3.0) * 0.5 * Math.pow(1.05, Math.max(1, TOTAL_TILES - 1));
                currentX += ((Math.random() - 0.5) * 5) * baseScale;
                currentY += ((Math.random() * 1.3 + 1.1) * 0.5) * baseScale; 
                currentZ += ((Math.random() - 0.5) * 5 - 3) * baseScale;
                createPlatform(currentX, currentY + 2, currentZ - 5, 15, 0.5, 15, 0xffd700, true, false, 'normal');
            }
        }

        function createPlatform(x, y, z, w, h, d, color, isGoal, isSpawnTile = false, type = 'normal', typeConfig = {}) {
            const material = new THREE.MeshStandardMaterial({ color });
            if (type === 'disappearing') material.transparent = true;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            scene.add(mesh);
            platforms.push({ 
                mesh, 
                center: new THREE.Vector3(x, y, z), 
                min: new THREE.Vector3(x-w/2, y-h/2, z-d/2), 
                max: new THREE.Vector3(x+w/2, y+h/2, z+d/2), 
                isGoal, 
                isSpawnTile,
                w, h, d,
                type,
                typeConfig,
                isActive: true,
                trap: null,
                originalColor: color,
                deltaX: 0, deltaY: 0, deltaZ: 0
            });
        }

        function updatePlatforms() {
            let now = performance.now();
            platforms.forEach(p => {
                p.deltaX = 0; p.deltaY = 0; p.deltaZ = 0;
                
                // 動きの更新
                if (p.type === 'disappearing') {
                    let cycle = p.typeConfig.hideDuration + p.typeConfig.showDuration;
                    let t = (now + p.typeConfig.timer) % cycle;
                    if (t < p.typeConfig.showDuration) {
                        if (!p.isActive) {
                            p.mesh.visible = true;
                            p.isActive = true;
                        }
                        if (p.typeConfig.showDuration - t < 1500) {
                            p.mesh.material.opacity = Math.floor(now / 150) % 2 === 0 ? 0.3 : 0.8;
                        } else {
                            p.mesh.material.opacity = 1.0;
                        }
                    } else {
                        if (p.isActive) {
                            p.mesh.visible = false;
                            p.isActive = false;
                            p.trap = null; // 消える足場のトラップは消滅
                        }
                    }
                } else if (p.type === 'moving_v') {
                    let newY = p.typeConfig.originY + Math.sin(now * p.typeConfig.speed * 0.001 + p.typeConfig.phase) * p.typeConfig.range;
                    p.deltaY = newY - p.mesh.position.y;
                    p.mesh.position.y = newY;
                    p.center.y = newY;
                    p.min.y = newY - p.h / 2;
                    p.max.y = newY + p.h / 2;
                } else if (p.type === 'moving_h') {
                    let newX = p.typeConfig.originX + Math.sin(now * p.typeConfig.speed * 0.001 + p.typeConfig.phase) * p.typeConfig.range;
                    p.deltaX = newX - p.mesh.position.x;
                    p.mesh.position.x = newX;
                    p.center.x = newX;
                    p.min.x = newX - p.w / 2;
                    p.max.x = newX + p.w / 2;
                }
                
                // トラップの更新
                if (p.trap && p.isActive) {
                    if (now > p.trap.expire) {
                        p.mesh.material.color.setHex(p.originalColor);
                        p.trap = null;
                    } else {
                        // トラップ判定
                        [player, ...npcs].forEach(char => {
                            if (char.currentPlatform === p && char.id !== p.trap.owner) {
                                killChar(char, p.trap.owner);
                                p.mesh.material.color.setHex(p.originalColor);
                                p.trap = null;
                            }
                        });
                    }
                }
            });
        }

        function isInSpawnSafeZone(char) {
            if (!char.mesh) return false;
            if (char.currentPlatform && (char.currentPlatform.isSpawnTile || char.currentPlatform.type === 'savepoint')) {
                return true;
            }
            // 空中や初期地点付近
            let footY = char.mesh.position.y - char.height / 2;
            if (footY < 1.0) return true; 
            return false;
        }

        function createDeathEffect(pos, color) {
            for (let i = 0; i < 15; i++) {
                const geo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                const mat = new THREE.MeshLambertMaterial({ color: color });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                scene.add(mesh);
                particles.push({
                    mesh: mesh,
                    velocity: new THREE.Vector3((Math.random()-0.5)*10, Math.random()*10, (Math.random()-0.5)*10),
                    expire: performance.now() + 1000
                });
            }
        }

        function killChar(char, killerId = null) {
            createDeathEffect(char.mesh.position, char.mesh.material.color.getHex());
            
            if (killerId) {
                let killer = [player, ...npcs].find(c => c.id === killerId);
                if (killer) {
                    killer.gold += GOLD_PER_KILL;
                    if (killer.id === "player") {
                        document.getElementById('game-status').innerText = `🎯 TRAP KILL! +${GOLD_PER_KILL}G`;
                        setTimeout(() => { document.getElementById('game-status').innerText = ""; }, 2000);
                    }
                }
            }
            
            // リスポーン位置へ
            char.mesh.position.copy(char.respawnPos);
            char.mesh.position.x += (Math.random() - 0.5) * 2;
            char.mesh.position.z += (Math.random() - 0.5) * 2;
            char.velocity.set(0, 0, 0);
            char.remainingJumps = char.maxJumps;
            char.onGround = true;
            char.currentPlatform = null;
        }

        function updateTrapResources(char, now) {
            if (TRAP_MODE !== 'reload') return;
            if (char.traps >= char.trapMax) {
                char.trapReloadTimer = 0;
                return;
            }
            if (!char.trapReloadTimer) char.trapReloadTimer = now + TRAP_RELOAD_INTERVAL;
            if (now >= char.trapReloadTimer) {
                char.traps = Math.min(char.trapMax, char.traps + 1);
                char.trapReloadTimer = char.traps < char.trapMax ? now + TRAP_RELOAD_INTERVAL : 0;
            }
        }

        function executeTrap(char) {
            if (isGameOver) return;
            if (isInSpawnSafeZone(char)) return; 
            if (char.traps <= 0) return;
            if (!char.onGround || !char.currentPlatform) return;
            if (char.currentPlatform.trap) return; // 既にトラップあり
            if (char.currentPlatform.isSpawnTile || char.currentPlatform.type === 'savepoint') return; // セーフゾーン

            char.traps--;
            char.currentPlatform.trap = { owner: char.id, expire: performance.now() + TRAP_AUTO_DISAPPEAR_DURATION };
            char.currentPlatform.originalColor = char.currentPlatform.mesh.material.color.getHex();
            char.currentPlatform.mesh.material.color.setHex(0xff0000);
            
            if (char.id === 'player') {
                updateTrapDisplay();
            }
        }

        function handleTrapAction() {
            if (document.getElementById('settings-modal').style.display === 'flex') return;
            if (!isAutoMode) executeTrap(player);
        }

        function tryJump(char) {
            if (!char.canJumpAfterHit || isGameOver) return;
            if (char.onGround) {
                char.velocity.y = JUMP_FORCE;
                char.onGround = false;
                char.currentPlatform = null; 
                char.remainingJumps = char.maxJumps - 1; 
            } else if (char.remainingJumps > 0) {
                char.velocity.y = JUMP_FORCE;
                char.remainingJumps--; 
            }
        }

        function calculateAIMovement(npc) {
            if (isGameOver) return;
            
            // トラップ設置判断
            if (npc.traps > 0 && npc.onGround && Math.random() < 0.05) {
                executeTrap(npc);
            }
            const bestShop = getBestAffordableShop(npc);
            if (bestShop && npc.onGround && npc.currentPlatform && (npc.currentPlatform.isSpawnTile || npc.currentPlatform.type === 'savepoint')) {
                purchaseShopItem(npc, bestShop, performance.now());
            }

            npc.stopTimer--;
            if (npc.stopTimer <= 0) {
                npc.isStopped = Math.random() < 0.3;
                npc.stopTimer = Math.random() * 60 + 30;
            }
            if (npc.isStopped) return;

            let maxJumpHeight = (JUMP_FORCE * JUMP_FORCE) / (2 * GRAVITY);
            let flightFramesPerJump = 2 * (JUMP_FORCE / GRAVITY);
            
            let currentUpwardReach = npc.velocity.y > 0 ? (npc.velocity.y * npc.velocity.y) / (2 * GRAVITY) : 0;
            let totalReachY = currentUpwardReach + (npc.remainingJumps * maxJumpHeight);
            let totalReachXZ = (npc.remainingJumps * flightFramesPerJump * PLAYER_SPEED);
            if (npc.velocity.y > 0) totalReachXZ += (2 * npc.velocity.y / GRAVITY) * PLAYER_SPEED;

            let candidates = platforms.filter(p => {
                if (!p.isActive && p.type !== 'disappearing') return false; 
                if (p.trap && p.trap.owner !== npc.id) return false; // トラップ回避
                
                let isSafe = true;
                if (p.type === 'disappearing') {
                    let cycle = p.typeConfig.hideDuration + p.typeConfig.showDuration;
                    let t = (performance.now() + p.typeConfig.timer) % cycle;
                    if (t >= p.typeConfig.showDuration - 1500) isSafe = false; 
                    if (!p.isActive) isSafe = false; 
                }
                if (!isSafe) return false;

                let diffY = p.max.y - (npc.mesh.position.y - npc.height/2);
                let diffX = p.center.x - npc.mesh.position.x;
                let diffZ = p.center.z - npc.mesh.position.z;
                let distXZ = Math.sqrt(diffX*diffX + diffZ*diffZ);
                
                return diffY <= totalReachY * 0.9 && distXZ <= totalReachXZ * 0.9 && p.center.y > npc.mesh.position.y - 1.0;
            });

            let target = candidates.sort((a,b) => b.center.y - a.center.y)[0];
            const savepointTarget = platforms.find(p => p.type === 'savepoint' && p.isActive && p.center.y >= npc.mesh.position.y - 0.5);
            if (savepointTarget && npc.gold > 0 && (!target || savepointTarget.center.y >= target.center.y - 0.25)) {
                target = savepointTarget;
            }
            if (!target) {
                target = platforms.find(p => p.isActive && p.center.y > npc.mesh.position.y + 0.1);
            }
            if (!target) return;

            let diff = new THREE.Vector3().subVectors(target.center, npc.mesh.position);
            let distXZ = Math.sqrt(diff.x**2 + diff.z**2);
            if (distXZ > 0.1) {
                npc.velocity.x = THREE.MathUtils.lerp(npc.velocity.x, (diff.x/distXZ) * PLAYER_SPEED, 0.1);
                npc.velocity.z = THREE.MathUtils.lerp(npc.velocity.z, (diff.z/distXZ) * PLAYER_SPEED, 0.1);
            }

            let targetIsAbove = target.max.y > npc.mesh.position.y - npc.height/2 + 0.1;
            if (npc.onGround) {
                if (targetIsAbove || distXZ > 3.0) tryJump(npc);
            } else {
                if (npc.velocity.y <= 0.0) {
                    if (targetIsAbove || distXZ > 2.0) {
                        tryJump(npc);
                    }
                }
            }
        }

        function setupInputs() {
            window.addEventListener('keydown', (e) => {
                if (document.getElementById('settings-modal').style.display === 'flex') return;
                if (e.repeat) return; 
                keyboard[e.code] = true;
                if (e.code === 'Space' && !isAutoMode) tryJump(player);
                if ((e.code === 'KeyN') && !isAutoMode) executeTrap(player);
            });
            window.addEventListener('keyup', (e) => keyboard[e.code] = false);
            
            const joystick = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: { left: '75px', bottom: '75px' }, color: 'white' });

            joystick.on('move', (evt, data) => {
                if (document.getElementById('settings-modal').style.display === 'flex') return;
                if (!isAutoMode && data && data.angle) {
                    let moveX = Math.cos(data.angle.radian || data.angle.radian);
                    let moveZ = -Math.sin(data.angle.radian || data.angle.radian);
                    let force = Math.min(data.force || 1, 1);

                    const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
                    if (len > 0) {
                        moveX /= len;
                        moveZ /= len;
                    }

                    player.joystickInput.x = moveX * force;
                    player.joystickInput.z = moveZ * force;
                }
            });

            joystick.on('end', () => {
                player.joystickInput.x = 0;
                player.joystickInput.z = 0;
            });
            
            document.getElementById('jump-touch-zone').addEventListener('touchstart', (e) => { e.preventDefault(); if(document.getElementById('settings-modal').style.display === 'flex') return; if(!isAutoMode) tryJump(player); }, { passive: false });
            document.getElementById('trap-touch-zone').addEventListener('touchstart', (e) => { e.preventDefault(); handleTrapAction(); }, { passive: false });
        }

        function updateCharacterPhysics(char, isNPC) {
            if (!isGameOver) {
                if (isNPC) calculateAIMovement(char);
                    else if (!isAutoMode) {
                        let inputX = 0, inputZ = 0;
                        if (keyboard['KeyW'] || keyboard['ArrowUp']) inputZ -= 1;
                        if (keyboard['KeyS'] || keyboard['ArrowDown']) inputZ += 1;
                        if (keyboard['KeyA'] || keyboard['ArrowLeft']) inputX -= 1;
                        if (keyboard['KeyD'] || keyboard['ArrowRight']) inputX += 1;

                        inputX += (char.joystickInput.x || 0);
                        inputZ += (char.joystickInput.z || 0);

                        const inputVec = new THREE.Vector3(inputX, 0, inputZ);
                        if (inputVec.lengthSq() > 1e-6) {
                            inputVec.normalize().multiplyScalar(PLAYER_SPEED);
                            char.velocity.x = THREE.MathUtils.lerp(char.velocity.x, inputVec.x, 0.6);
                            char.velocity.z = THREE.MathUtils.lerp(char.velocity.z, inputVec.z, 0.6);
                        } else {
                            char.velocity.x = THREE.MathUtils.lerp(char.velocity.x, 0, 0.3);
                            char.velocity.z = THREE.MathUtils.lerp(char.velocity.z, 0, 0.3);
                        }
                    } else { calculateAIMovement(char); }
            }
            
            updateTrapResources(char, performance.now());

            char.velocity.y -= GRAVITY;
            char.mesh.position.add(char.velocity);

            if (char.currentPlatform && char.currentPlatform.isActive) {
                char.mesh.position.x += char.currentPlatform.deltaX || 0;
                char.mesh.position.y += char.currentPlatform.deltaY || 0;
                char.mesh.position.z += char.currentPlatform.deltaZ || 0;
            }

            if (char.mesh.position.y < char.respawnPos.y - 40) {
                killChar(char, null); // 落下死
                return;
            }

            char.onGround = false;
            char.currentPlatform = null;
            platforms.forEach(b => {
                if (!b.isActive) return;
                if (char.mesh.position.x + char.radius > b.min.x && char.mesh.position.x - char.radius < b.max.x &&
                    char.mesh.position.z + char.radius > b.min.z && char.mesh.position.z - char.radius < b.max.z) {
                    
                    let fallThreshold = Math.max(0.5, (b.deltaY || 0) + 0.5);
                    if (char.mesh.position.y - char.height/2 <= b.max.y && char.mesh.position.y - char.height/2 > b.max.y - fallThreshold && char.velocity.y <= (b.deltaY || 0) + 0.1) {
                        char.velocity.y = 0;
                        char.mesh.position.y = b.max.y + char.height/2;
                        char.onGround = true;
                        char.currentPlatform = b;
                        char.remainingJumps = char.maxJumps;
                        char.canJumpAfterHit = true;
                        
                        if (b.type === 'savepoint') {
                            char.respawnPos.set(b.center.x, b.center.y + 2, b.center.z);
                        }
                        
                        if (b.isGoal && !isGameOver) {
                            if (speedrunState.active && char.id !== 'player') {
                                finishSpeedrun(true, char.name);
                            } else {
                                isGameOver = true;
                                document.getElementById('game-status').innerText = `${char.name} GOAL!`;
                            }
                        }
                    }
                }
            });
            char.velocity.x *= 0.9; char.velocity.z *= 0.9;
        }

        function handleCharacterCollisions() {
            let all = [player, ...npcs];
            for (let i = 0; i < all.length; i++) {
                for (let j = i + 1; j < all.length; j++) {
                    let c1 = all[i], c2 = all[j];
                    let dist = c1.mesh.position.distanceTo(c2.mesh.position);
                    if (dist < c1.radius + c2.radius && Math.abs(c1.mesh.position.y - c2.mesh.position.y) < 1.0) {
                        let push = new THREE.Vector3().subVectors(c2.mesh.position, c1.mesh.position).normalize().multiplyScalar(0.05);
                        c1.mesh.position.sub(push);
                        c2.mesh.position.add(push);
                    }
                }
            }
        }

        function updateOverheadLabels() {
            const all = [player, ...npcs];
            const tempV = new THREE.Vector3();

            all.forEach(char => {
                if (!char.domLabel || !char.mesh) return;

                tempV.copy(char.mesh.position);
                tempV.y += char.height / 2 + 0.6; 
                tempV.project(camera);

                if (tempV.z > 1) {
                    char.domLabel.style.opacity = 0;
                    return;
                }

                char.domLabel.style.opacity = 1;
                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;
                char.domLabel.style.left = `${x}px`;
                char.domLabel.style.top = `${y}px`;

                char.domInfoText.innerHTML = `${char.name} <span style="color:#00e676;">[${char.remainingJumps}/${char.maxJumps}]</span> <span style="color:#ffd700;">${char.gold}G</span>`;
            });
        }

        function updateShopLabels() {
            const tempV = new THREE.Vector3();
            shopObjects.forEach(shop => {
                if (!shop.domLabel || !shop.mesh || !shop.active) return;

                tempV.copy(shop.mesh.position);
                tempV.y += 1.8;
                tempV.project(camera);

                if (tempV.z > 1) {
                    shop.domLabel.style.opacity = 0;
                    return;
                }

                shop.domLabel.style.opacity = 1;
                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;
                shop.domLabel.style.left = `${x}px`;
                shop.domLabel.style.top = `${y}px`;
            });
        }

        function updateTrapDisplay() {
            const trapDisplay = document.getElementById('trap-display');
            const trapButton = document.getElementById('trap-action-btn');
            const modeText = TRAP_MODE === 'reload' ? 'R' : 'C';
            const playerTrapText = `TRAP: ${player.traps}/${player.trapMax} (${modeText})`;
            trapDisplay.innerText = playerTrapText;
            trapDisplay.style.color = player.traps > 0 ? '#ff5722' : '#757575';
            trapButton.classList.toggle('disabled', player.traps <= 0 || !player.onGround || !player.currentPlatform || player.currentPlatform.trap || isGameOver);
            trapButton.disabled = player.traps <= 0 || !player.onGround || !player.currentPlatform || player.currentPlatform.trap || isGameOver;
            trapButton.innerText = player.traps > 0 ? `TRAP ${player.traps}/${player.trapMax}` : 'TRAP EMPTY';
        }

        function animate() {
            requestAnimationFrame(animate);
            let now = performance.now();
            updateSpeedrunTimer(now);
            if (speedrunState.finished) {
                camera.position.set(player.mesh.position.x, player.mesh.position.y + 10, player.mesh.position.z + 20);
                camera.lookAt(player.mesh.position);
                renderer.render(scene, camera);
                updateOverheadLabels();
                updateShopLabels();
                return;
            }
            updatePlatforms(); 

            updateCharacterPhysics(player, false);
            if (document.getElementById('settings-modal').style.display !== 'flex') {
                if ((keyboard['Space'] || false) && !prevKeyboard['Space']) {
                    tryJump(player);
                }
            }
            npcs.forEach(n => updateCharacterPhysics(n, true));
            handleCharacterCollisions();
            
            // ショップオブジェクトとの当たり判定と回転
            let allChars = [player, ...npcs];
            shopObjects.forEach(shop => {
                if (!shop.active) return;
                shop.mesh.rotation.y += 0.02;
                allChars.forEach(char => {
                    if (char.mesh.position.distanceTo(shop.mesh.position) < 2.0) {
                        purchaseShopItem(char, shop, now);
                    }
                });
            });

            // 死亡エフェクトの更新
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                if (now > p.expire) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                } else {
                    p.mesh.position.add(p.velocity.clone().multiplyScalar(0.016));
                    p.velocity.y -= GRAVITY * 5; 
                }
            }
            
            camera.position.set(player.mesh.position.x, player.mesh.position.y + 10, player.mesh.position.z + 20);
            camera.lookAt(player.mesh.position);
            renderer.render(scene, camera);

            updateOverheadLabels();
            updateShopLabels();

            let list = [player, ...npcs].sort((a,b) => b.mesh.position.y - a.mesh.position.y);
            document.getElementById('rank-list').innerHTML = list.map((c, i) => `
                <div class="${c.id==='player'?'rank-item player-row':'rank-item'}">
                    <span>${i+1}. ${c.name} <span class="jump-count">[${c.remainingJumps}/${c.maxJumps}]</span><span class="gold-count">${c.gold}G</span></span>
                    <span>${Math.max(0, Math.floor(c.mesh.position.y))}m</span>
                </div>`).join('');
                
            document.getElementById('height-display').innerText = `Height: ${Math.max(0, Math.floor(player.mesh.position.y))}m`;
            document.getElementById('jump-display').innerText = `Jumps: ${player.remainingJumps}/${player.maxJumps}`;
            document.getElementById('gold-display').innerText = `Gold: ${player.gold}G`;
            document.getElementById('speedrun-display').innerText = speedrunState.active
                ? `Speedrun x${speedrunState.multiplier}: ${Math.floor(speedrunState.realElapsedMs / 1000)}s / ${speedrunState.limitSec}s`
                : 'Speedrun: OFF';
            
            updateTrapDisplay();
            
            prevKeyboard['Space'] = !!keyboard['Space'];
        }

        function toggleMode() { isAutoMode = !isAutoMode; document.getElementById('mode-toggle-btn').innerText = isAutoMode ? "MODE: AUTO" : "MODE: MANUAL"; }
        
        // --- 設定メニュー制御 ---
        function switchTab(tab) {
            document.getElementById('tab-btn-settings').style.background = tab === 'settings' ? '#eee' : '#fff';
            document.getElementById('tab-btn-settings').style.fontWeight = tab === 'settings' ? 'bold' : 'normal';
            document.getElementById('tab-content-settings').style.display = tab === 'settings' ? 'block' : 'none';
            
            document.getElementById('tab-btn-test').style.background = tab === 'test' ? '#eee' : '#fff';
            document.getElementById('tab-btn-test').style.fontWeight = tab === 'test' ? 'bold' : 'normal';
            document.getElementById('tab-content-test').style.display = tab === 'test' ? 'block' : 'none';
        }

        async function loadTestLauncher() {
            try {
                const response = await fetch('param.txt');
                if (!response.ok) throw new Error('param.txt not found');
                const text = await response.text();
                const lines = text.split('\n').map(l => l.trim()).filter(l => l);
                
                const ul = document.getElementById('test-links-list');
                ul.innerHTML = '';
                
                lines.forEach(line => {
                    let parts = line.split(',');
                    if (parts.length >= 2) {
                        let label = parts[0];
                        let params = parts.slice(1).join(',');
                        if (!/[?&]AUTO_MODE=/.test(`?${params}`)) {
                            params += (params.includes('&') ? '&' : '&') + 'AUTO_MODE=1';
                        }
                        if (!/[?&]SPEEDRUN_MODE=/.test(`?${params}`)) {
                            params += '&SPEEDRUN_MODE=1';
                        }
                        let li = document.createElement('li');
                        li.innerHTML = `<a href="?${params}" style="color:#e91e63; text-decoration:none; font-weight:bold;">${label}</a>`;
                        ul.appendChild(li);
                    }
                });
            } catch (e) {
                console.log('Failed to load param.txt', e);
                document.getElementById('test-links-list').innerHTML = '<li style="color:red;">param.txtの読み込みに失敗しました</li>';
            }
        }

        function openSettings() {
            document.getElementById('input-NPC_COUNT').value = NPC_COUNT;
            document.getElementById('input-TOTAL_TILES').value = TOTAL_TILES;
            document.getElementById('input-PLAYER_SPEED').value = PLAYER_SPEED;
            document.getElementById('input-JUMP_FORCE').value = JUMP_FORCE;
            document.getElementById('input-GRAVITY').value = GRAVITY;
            document.getElementById('input-TRAP_DURATION').value = TRAP_DURATION;
            document.getElementById('input-TRAP_AUTO_DISAPPEAR_DURATION').value = TRAP_AUTO_DISAPPEAR_DURATION;
            document.getElementById('input-TRAP_MAX_COUNT').value = TRAP_MAX_COUNT;
            document.getElementById('input-TRAP_RELOAD_INTERVAL').value = TRAP_RELOAD_INTERVAL;
            document.getElementById('input-TRAP_MODE').value = TRAP_MODE;
            document.getElementById('input-SAVE_INTERVAL').value = SAVE_INTERVAL;
            document.getElementById('input-GOLD_PER_KILL').value = GOLD_PER_KILL;
            document.getElementById('input-SHOP_ITEMS').value = encodeShopItems(SHOP_ITEMS);
            document.getElementById('input-SPEEDRUN_MODE').value = SPEEDRUN_MODE ? 'on' : 'off';
            document.getElementById('input-SPEEDRUN_LIMIT_SEC').value = SPEEDRUN_LIMIT_SEC;
            document.getElementById('input-SPEEDRUN_MULTIPLIER').value = SPEEDRUN_MULTIPLIER;
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function resetSettings() {
            try {
                localStorage.removeItem('climb_NPC_COUNT');
                localStorage.removeItem('climb_TOTAL_TILES');
                localStorage.removeItem('climb_PLAYER_SPEED');
                localStorage.removeItem('climb_JUMP_FORCE');
                localStorage.removeItem('climb_GRAVITY');
                localStorage.removeItem('climb_TRAP_DURATION');
                localStorage.removeItem('climb_TRAP_AUTO_DISAPPEAR_DURATION');
                localStorage.removeItem('climb_TRAP_MAX_COUNT');
                localStorage.removeItem('climb_TRAP_RELOAD_INTERVAL');
                localStorage.removeItem('climb_TRAP_MODE');
                localStorage.removeItem('climb_SAVE_INTERVAL');
                localStorage.removeItem('climb_GOLD_PER_KILL');
                localStorage.removeItem('climb_SHOP_ITEMS');
                localStorage.removeItem('climb_AUTO_MODE');
                localStorage.removeItem('climb_SPEEDRUN_MODE');
                localStorage.removeItem('climb_SPEEDRUN_LIMIT_SEC');
                localStorage.removeItem('climb_SPEEDRUN_MULTIPLIER');
            } catch(e) {}
            // GETパラメータを消してリロード
            window.location.href = window.location.pathname;
        }

        function saveSettings() {
            try {
                localStorage.setItem('climb_NPC_COUNT', document.getElementById('input-NPC_COUNT').value);
                localStorage.setItem('climb_TOTAL_TILES', document.getElementById('input-TOTAL_TILES').value);
                localStorage.setItem('climb_PLAYER_SPEED', document.getElementById('input-PLAYER_SPEED').value);
                localStorage.setItem('climb_JUMP_FORCE', document.getElementById('input-JUMP_FORCE').value);
                localStorage.setItem('climb_GRAVITY', document.getElementById('input-GRAVITY').value);
                localStorage.setItem('climb_TRAP_DURATION', document.getElementById('input-TRAP_DURATION').value);
                localStorage.setItem('climb_TRAP_AUTO_DISAPPEAR_DURATION', document.getElementById('input-TRAP_AUTO_DISAPPEAR_DURATION').value);
                localStorage.setItem('climb_TRAP_MAX_COUNT', document.getElementById('input-TRAP_MAX_COUNT').value);
                localStorage.setItem('climb_TRAP_RELOAD_INTERVAL', document.getElementById('input-TRAP_RELOAD_INTERVAL').value);
                localStorage.setItem('climb_TRAP_MODE', document.getElementById('input-TRAP_MODE').value);
                localStorage.setItem('climb_SAVE_INTERVAL', document.getElementById('input-SAVE_INTERVAL').value);
                localStorage.setItem('climb_GOLD_PER_KILL', document.getElementById('input-GOLD_PER_KILL').value);
                localStorage.setItem('climb_SHOP_ITEMS', document.getElementById('input-SHOP_ITEMS').value);
                localStorage.setItem('climb_SPEEDRUN_MODE', document.getElementById('input-SPEEDRUN_MODE').value);
                localStorage.setItem('climb_SPEEDRUN_LIMIT_SEC', document.getElementById('input-SPEEDRUN_LIMIT_SEC').value);
                localStorage.setItem('climb_SPEEDRUN_MULTIPLIER', document.getElementById('input-SPEEDRUN_MULTIPLIER').value);
            } catch(e) {}
            // 設定を保存した場合はベースのファイルに戻る
            window.location.href = window.location.pathname;
        }

        window.onload = init;
        if (AUTO_MODE) {
            isAutoMode = true;
        }
    </script>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Only Up Clone - Mega Jump & Double Reward</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* UIレイヤー */
        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 20px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 20;
        }
        #height-display {
            font-size: 28px;
            font-weight: bold;
        }
        #jump-display {
            font-size: 18px;
            color: #00e676;
            font-weight: bold;
        }
        #punch-display {
            font-size: 18px;
            color: #ff9800;
            font-weight: bold;
        }
        #game-status {
            font-size: 32px;
            font-weight: bold;
            color: #ffeb3b;
            background-color: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 5px;
        }
        #mode-toggle-btn {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #e91e63;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            width: 150px;
        }
        #mode-toggle-btn.auto-mode {
            background-color: #00e676;
            color: #333;
        }

        /* 順位表示 */
        #leaderboard {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 240px; 
            max-height: 45vh;
            background-color: rgba(0,0,0,0.6);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            overflow-y: auto;
            z-index: 20;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        #leaderboard h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 3px;
            color: #ffeb3b;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
            align-items: center;
        }
        .rank-item.player-row {
            color: #ff4081;
            font-weight: bold;
            background-color: rgba(255,255,255,0.2);
            border-radius: 2px;
            padding: 1px 4px;
        }
        .jump-count {
            color: #00e676;
            font-weight: normal;
            margin-left: 5px;
        }
        .jump-count.locked {
            color: #ff1744;
            font-weight: bold;
        }

        /* 操作ゾーン */
        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            z-index: 10;
        }
        #punch-touch-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 50vw;
            height: 100vh;
            z-index: 5;
        }
        #jump-touch-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 5;
        }
    </style>
    <script src="libs/three.min.js"></script>
    <script src="libs/nipplejs.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div id="height-display">Height: 0m</div>
        <div id="jump-display">Max Jumps: 2</div>
        <div id="punch-display">PUNCH: READY</div>
        <div id="game-status"></div>
        <button id="mode-toggle-btn" onclick="toggleMode()">MODE: MANUAL</button>
    </div>

    <div id="leaderboard">
        <h3>🏆 LEADERBOARD (JUMPS)</h3>
        <div id="rank-list"></div>
    </div>
    
    <div id="joystick-zone"></div>
    <div id="punch-touch-zone"></div>
    <div id="jump-touch-zone"></div>
    <div id="canvas-container"></div>

    <script>
        // --- ゲーム設定 ---
        const PLAYER_SPEED = 0.12; 
        const JUMP_FORCE = 0.375;    // 【調整】ジャンプの高さを1.5倍に強化（0.25 -> 0.375）
        const GRAVITY = 0.0098;
        const TOTAL_TILES = 15; 
        const STICK_SENSITIVITY = 1.0; 
        const PUNCH_COOLDOWN = 1000; 
        const PUNCH_RANGE = 3.5;     
        const PUNCH_KNOCKBACK = 1.6; 
        const KILL_WINDOW = 5000;    
        
        // --- 状態管理 ---
        let scene, camera, renderer;
        let player = {
            id: "player",
            name: "PLAYER",
            mesh: null,
            radius: 1.0, 
            height: 1.8,
            velocity: new THREE.Vector3(),
            onGround: false,
            maxJumps: 2,         
            remainingJumps: 2,   
            canJumpAfterHit: true, 
            lastPunchTime: 0,    
            lastHitBy: null,     
            lastHitTime: 0,      
            joystickInput: { x: 0, z: 0 }
        };
        
        let npcs = []; 
        let platforms = [];
        let punchVisuals = []; 
        let keyboard = {};
        let isAutoMode = false;
        let isGameOver = false;
        
        // --- 初期化 ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.008); 

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 120, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048; 
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // プレイヤー作成
            const playerGeo = new THREE.CylinderGeometry(player.radius, player.radius, player.height, 16);
            const playerMat = new THREE.MeshLambertMaterial({ color: 0xe91e63 }); 
            player.mesh = new THREE.Mesh(playerGeo, playerMat);
            player.mesh.position.set(0, player.height / 2, 0);
            player.mesh.castShadow = true;
            scene.add(player.mesh);

            // NPC 20体作成
            createNPCs(20);

            // ステージ生成
            generateStage();

            // 入力設定
            setupInputs();

            window.addEventListener('resize', onWindowResize, false);

            animate();
        }

        function createNPCs(count) {
            const npcGeo = new THREE.CylinderGeometry(player.radius, player.radius, player.height, 16);
            for(let i = 0; i < count; i++) {
                const npcMat = new THREE.MeshLambertMaterial({ 
                    color: new THREE.Color().setHSL((i * 0.05) % 1.0, 0.8, 0.4 + Math.random()*0.2) 
                });
                const mesh = new THREE.Mesh(npcGeo, npcMat);
                mesh.castShadow = true;
                mesh.position.set((Math.random()-0.5)*16, player.height/2, (Math.random()-0.5)*16);
                scene.add(mesh);

                npcs.push({
                    id: `npc_${i}`,
                    name: `NPC ${i+1}`,
                    mesh: mesh,
                    radius: player.radius,
                    height: player.height,
                    velocity: new THREE.Vector3(),
                    onGround: false,
                    maxJumps: 2,
                    remainingJumps: 2,
                    canJumpAfterHit: true, 
                    lastPunchTime: 0,
                    lastHitBy: null,
                    lastHitTime: 0,
                    stopTimer: 0,
                    isStopped: false
                });
            }
        }

        function generateStage() {
            createPlatform(0, -0.5, 0, 30, 1, 30, 0x333333, false); 

            let currentX = 0;
            let currentY = 1.0; 
            let currentZ = -5;

            for (let i = 1; i < TOTAL_TILES; i++) {
                let w = Math.random() * 3 + 7.0; 
                let h = 0.4; 
                let d = Math.random() * 3 + 7.0; 

                let baseScale = ((1.5 + Math.random() * 0.5) * 3.0) * 0.5;
                let heightMultiplier = Math.pow(1.1, i);
                let finalScale = baseScale * heightMultiplier;

                currentX += ((Math.random() - 0.5) * 5) * finalScale;
                currentY += ((Math.random() * 1.3 + 1.1) * 0.5) * finalScale; 
                currentZ += ((Math.random() - 0.5) * 5 - 3) * finalScale;

                const colors = [0x4caf50, 0x2196f3, 0xffeb3b, 0xff9800, 0x9c27b0];
                const color = colors[Math.floor(Math.random() * colors.length)];

                createPlatform(currentX, currentY, currentZ, w, h, d, color, false);
            }

            let finalScale = (((1.5 + Math.random() * 0.5) * 3.0) * 0.5) * Math.pow(1.1, TOTAL_TILES);
            currentX += ((Math.random() - 0.5) * 3) * finalScale;
            currentY += 1.2 * finalScale;
            currentZ -= 4 * finalScale;
            createPlatform(currentX, currentY, currentZ, 20, 0.5, 20, 0xffd700, true);
        }

        function createPlatform(x, y, z, w, h, d, color, isGoal = false) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ 
                color: color, 
                metalness: isGoal ? 0.8 : 0.2, 
                roughness: isGoal ? 0.2 : 0.5 
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);

            platforms.push({
                mesh: mesh,
                center: new THREE.Vector3(x, y, z),
                min: new THREE.Vector3(x - w/2, y - h/2, z - d/2),
                max: new THREE.Vector3(x + w/2, y + h/2, z + d/2),
                isGoal: isGoal
            });
        }

        function toggleMode() {
            isAutoMode = !isAutoMode;
            const btn = document.getElementById('mode-toggle-btn');
            if (isAutoMode) {
                btn.innerText = "MODE: AUTO";
                btn.classList.add('auto-mode');
            } else {
                btn.innerText = "MODE: MANUAL";
                btn.classList.remove('auto-mode');
                player.joystickInput.x = 0;
                player.joystickInput.z = 0;
            }
        }

        function createPunchVisual(position) {
            const visualGeo = new THREE.RingGeometry(0, PUNCH_RANGE, 32);
            const visualMat = new THREE.MeshBasicMaterial({
                color: 0xff1744, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.5, 
                depthWrite: false 
            });
            const visualMesh = new THREE.Mesh(visualGeo, visualMat);
            
            visualMesh.rotation.x = Math.PI / 2;
            visualMesh.position.copy(position);
            visualMesh.position.y -= 0.8; 
            
            scene.add(visualMesh);

            punchVisuals.push({
                mesh: visualMesh,
                createdAt: performance.now(),
                duration: 180 
            });
        }

        function execute4WayPunch(attacker) {
            const now = performance.now();
            if (now - attacker.lastPunchTime < PUNCH_COOLDOWN) return; 

            attacker.lastPunchTime = now;

            createPunchVisual(attacker.mesh.position);

            if(attacker.mesh && attacker.mesh.material) {
                const origColor = attacker.mesh.material.color.getHex();
                attacker.mesh.material.color.setHex(0xffffff);
                setTimeout(() => { if(!isGameOver) attacker.mesh.material.color.setHex(origColor); }, 150);
            }

            const allChars = [player, ...npcs];
            const aPos = attacker.mesh.position;

            allChars.forEach(target => {
                if (target.id === attacker.id) return; 

                const tPos = target.mesh.position;
                let dx = tPos.x - aPos.x;
                let dy = tPos.y - aPos.y;
                let dz = tPos.z - aPos.z;
                let dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

                if (dist < PUNCH_RANGE) {
                    let angle = Math.atan2(dz, dx); 
                    let forceX = 0;
                    let forceZ = 0;

                    if (angle >= -Math.PI/4 && angle < Math.PI/4) { forceX = 1; }      
                    else if (angle >= Math.PI/4 && angle < 3*Math.PI/4) { forceZ = 1; } 
                    else if (angle >= -3*Math.PI/4 && angle < -Math.PI/4) { forceZ = -1; }
                    else { forceX = -1; }                                              

                    if (target.onGround) {
                        target.canJumpAfterHit = false; 
                    } else {
                        target.canJumpAfterHit = true; 
                    }

                    target.velocity.x += forceX * PUNCH_KNOCKBACK;
                    target.velocity.z += forceZ * PUNCH_KNOCKBACK;
                    target.velocity.y += 0.36; 

                    target.lastHitBy = attacker.id;
                    target.lastHitTime = now;
                }
            });
        }

        function checkNPCPunchTrigger(npc) {
            const now = performance.now();
            if (now - npc.lastPunchTime < PUNCH_COOLDOWN) return;

            const allChars = [player, ...npcs];
            const nPos = npc.mesh.position;

            for (let i = 0; i < allChars.length; i++) {
                let target = allChars[i];
                if (target.id === npc.id) continue;

                let dist = nPos.distanceTo(target.mesh.position);
                if (dist < PUNCH_RANGE - 0.2) { 
                    execute4WayPunch(npc);
                    break;
                }
            }
        }

        function calculateAIMovement(character, isNPC = false) {
            let move = { x: 0, z: 0 };
            if (isGameOver) return move;

            if (isNPC) {
                checkNPCPunchTrigger(character);

                character.stopTimer--;
                if (character.stopTimer <= 0) {
                    character.isStopped = Math.random() < 0.375; 
                    character.stopTimer = character.isStopped ? (Math.random() * 135 + 68) : (Math.random() * 50 + 30);
                }
                if (character.isStopped) return move; 
            }

            let target = null;
            let minHeightDiff = Infinity;
            const pos = character.mesh.position;

            for (let i = 0; i < platforms.length; i++) {
                let b = platforms[i];
                let heightDiff = b.center.y - (pos.y - character.height/2);
                if (heightDiff > 0.1 && heightDiff < minHeightDiff) {
                    minHeightDiff = heightDiff;
                    target = b;
                }
            }

            if (!target) return move;

            let diffX = target.center.x - pos.x;
            let diffZ = target.center.z - pos.z;
            let distanceXZ = Math.sqrt(diffX * diffX + diffZ * diffZ);

            if (distanceXZ > 0.1) {
                move.x = diffX / distanceXZ;
                move.z = diffZ / distanceXZ;
            }

            let dynamicRange = Math.min(45.0, 16.0 + (pos.y * 0.25));

            if (character.canJumpAfterHit) {
                if (character.onGround) {
                    if (distanceXZ < dynamicRange) { 
                        character.velocity.y = JUMP_FORCE;
                        character.onGround = false;
                        character.remainingJumps--;
                    }
                } else if (character.remainingJumps > 0 && character.velocity.y < -0.02) {
                    character.velocity.y = JUMP_FORCE;
                    character.remainingJumps--;
                }
            }

            return move;
        }

        function setupInputs() {
            window.addEventListener('keydown', (e) => { 
                keyboard[e.code] = true; 
                if (isGameOver) return;

                if (e.code === 'Space' && !isAutoMode && player.canJumpAfterHit) {
                    if (player.onGround) {
                        player.velocity.y = JUMP_FORCE;
                        player.onGround = false;
                        player.remainingJumps = player.maxJumps - 1; 
                    } else if (player.remainingJumps > 0) {
                        player.velocity.y = JUMP_FORCE;
                        player.remainingJumps--; 
                    }
                }

                if (e.code === 'KeyF' && !isAutoMode) {
                    execute4WayPunch(player);
                }
            });
            window.addEventListener('keydown', (e) => { keyboard[e.code] = true; });
            window.addEventListener('keyup', (e) => { keyboard[e.code] = false; });

            const joystick = nipplejs.create({
                zone: document.getElementById('joystick-zone'),
                mode: 'static',
                position: { left: '75px', bottom: '75px' },
                color: 'white'
            });

            joystick.on('move', (evt, data) => {
                if (!isAutoMode && data.direction) {
                    const rawX = Math.cos(data.angle.radial) * (data.distance / 50);
                    const rawZ = -Math.sin(data.angle.radial) * (data.distance / 50);
                    player.joystickInput.x = rawX * STICK_SENSITIVITY;
                    player.joystickInput.z = rawZ * STICK_SENSITIVITY;
                }
            });

            joystick.on('end', () => {
                player.joystickInput.x = 0; player.joystickInput.z = 0;
            });

            const jumpZone = document.getElementById('jump-touch-zone');
            jumpZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!isAutoMode && !isGameOver && player.canJumpAfterHit) {
                    if (player.onGround) {
                        player.velocity.y = JUMP_FORCE;
                        player.onGround = false;
                        player.remainingJumps = player.maxJumps - 1;
                    } else if (player.remainingJumps > 0) {
                        player.velocity.y = JUMP_FORCE;
                        player.remainingJumps--;
                    }
                }
            }, { passive: false });

            const punchZone = document.getElementById('punch-touch-zone');
            punchZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!isAutoMode && !isGameOver) {
                    execute4WayPunch(player);
                }
            }, { passive: false });
        }

        // --- キル報酬枠の変更ロジック ---
        function awardKillCredit(deadChar) {
            const now = performance.now();
            if (deadChar.lastHitBy && (now - deadChar.lastHitTime < KILL_WINDOW)) {
                const allChars = [player, ...npcs];
                const killer = allChars.find(c => c.id === deadChar.lastHitBy);
                
                if (killer) {
                    // 【修正】ジャンプの追加回数を「1回」から「2回ずつ」に引き上げ
                    killer.maxJumps += 2; 
                    if (killer.id === "player") {
                        document.getElementById('game-status').innerText = `🎯 NPC PUSH OUT! MAX JUMPS: +2 (${killer.maxJumps})!`;
                        setTimeout(() => { document.getElementById('game-status').innerText = ""; }, 2500);
                    }
                }
            }
            deadChar.lastHitBy = null;
        }

        function updateCharacterPhysics(char, isNPC) {
            let moveX = 0;
            let moveZ = 0;

            if (isGameOver) {
                char.velocity.set(0, char.velocity.y - GRAVITY, 0);
            } else if (isNPC) {
                let npcMove = calculateAIMovement(char, true);
                moveX = npcMove.x;
                moveZ = npcMove.z;
            } else {
                if (isAutoMode) {
                    let autoMove = calculateAIMovement(char, false);
                    moveX = autoMove.x;
                    moveZ = autoMove.z;
                } else {
                    moveX = char.joystickInput.x;
                    moveZ = char.joystickInput.z;

                    if (keyboard['KeyW'] || keyboard['ArrowUp']) moveZ = -1;
                    if (keyboard['KeyS'] || keyboard['ArrowDown']) moveZ = 1;
                    if (keyboard['KeyA'] || keyboard['ArrowLeft']) moveX = -1;
                    if (keyboard['KeyD'] || keyboard['ArrowRight']) moveX = 1;

                    if (keyboard['KeyW'] || keyboard['ArrowUp'] || keyboard['KeyS'] || keyboard['ArrowDown'] ||
                        keyboard['KeyA'] || keyboard['ArrowLeft'] || keyboard['KeyD'] || keyboard['ArrowRight']) {
                        if (moveX !== 0 && moveZ !== 0) {
                            const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
                            moveX /= length; moveZ /= length;
                        }
                    }
                }
            }

            char.velocity.x = THREE.MathUtils.lerp(char.velocity.x, moveX * PLAYER_SPEED, 0.1);
            char.velocity.z = THREE.MathUtils.lerp(char.velocity.z, moveZ * PLAYER_SPEED, 0.1);
            char.velocity.y -= GRAVITY;

            let nextPos = char.mesh.position.clone().add(char.velocity);

            if (nextPos.y < -40) {
                awardKillCredit(char); 

                char.mesh.position.set((Math.random()-0.5)*15, char.height/2, (Math.random()-0.5)*15);
                char.velocity.set(0, 0, 0);
                char.onGround = true;
                char.remainingJumps = char.maxJumps;
                char.canJumpAfterHit = true; 
                return;
            }

            let pMinX = nextPos.x - char.radius;
            let pMaxX = nextPos.x + char.radius;
            let pMinZ = nextPos.z - char.radius;
            let pMaxZ = nextPos.z + char.radius;
            let pMaxY = nextPos.y + char.height / 2;

            let hitGround = false;

            for (let i = 0; i < platforms.length; i++) {
                let b = platforms[i];

                if (pMaxX > b.min.x && pMinX < b.max.x &&
                    pMaxZ > b.min.z && pMinZ < b.max.z &&
                    pMaxY > b.min.y && (nextPos.y - char.height/2) < b.max.y) {
                    
                    let prevBottom = char.mesh.position.y - char.height / 2;
                    if (prevBottom >= b.max.y - 0.3 && char.velocity.y <= 0) {
                        char.velocity.y = 0;
                        nextPos.y = b.max.y + char.height / 2;
                        hitGround = true;

                        if (b.isGoal && !isGameOver) {
                            isGameOver = true;
                            document.getElementById('game-status').innerText = `🎉 ${char.name} WIN & GOAL !! 🎉`;
                        }
                        break;
                    } 
                    else if (char.mesh.position.y + char.height/2 <= b.min.y + 0.3 && char.velocity.y > 0) {
                        char.velocity.y = 0;
                        nextPos.y = b.min.y - char.height / 2;
                    }
                }
            }

            if (hitGround) {
                char.onGround = true;
                char.remainingJumps = char.maxJumps; 
                char.canJumpAfterHit = true; 
            } else {
                char.onGround = false;
            }

            char.mesh.position.copy(nextPos);
        }

        function handleCharacterCollisions() {
            let allChars = [player, ...npcs];

            for (let i = 0; i < allChars.length; i++) {
                for (let j = i + 1; j < allChars.length; j++) {
                    let c1 = allChars[i];
                    let c2 = allChars[j];

                    if (Math.abs(c1.mesh.position.y - c2.mesh.position.y) < player.height) {
                        let dx = c2.mesh.position.x - c1.mesh.position.x;
                        let dz = c2.mesh.position.z - c1.mesh.position.z;
                        let dist = Math.sqrt(dx * dx + dz * dz);
                        let minDist = c1.radius + c2.radius;

                        if (dist < minDist) {
                            if (dist === 0) {
                                dx = Math.random() - 0.5; dz = Math.random() - 0.5;
                                dist = Math.sqrt(dx*dx + dz*dz);
                            }
                            let overlap = minDist - dist;
                            let pushRatio = 0.5; 
                            let pushX = (dx / dist) * overlap * pushRatio;
                            let pushZ = (dz / dist) * overlap * pushRatio;

                            c1.mesh.position.x -= pushX; c1.mesh.position.z -= pushZ;
                            c2.mesh.position.x += pushX; c2.mesh.position.z += pushZ;
                        }
                    }
                }
            }
        }

        function updatePunchVisuals() {
            const now = performance.now();
            
            for (let i = punchVisuals.length - 1; i >= 0; i--) {
                let v = punchVisuals[i];
                let elapsed = now - v.createdAt;
                
                if (elapsed >= v.duration) {
                    scene.remove(v.mesh);
                    v.mesh.geometry.dispose();
                    v.mesh.material.dispose();
                    punchVisuals.splice(i, 1);
                } else {
                    let progress = elapsed / v.duration;
                    v.mesh.material.opacity = 0.5 * (1 - progress);
                    let currentScale = 1.0 + (progress * 0.2); 
                    v.mesh.scale.set(currentScale, currentScale, 1.0);
                }
            }
        }

        function updateLeaderboardAndUI() {
            const now = performance.now();
            const allChars = [player, ...npcs];

            allChars.sort((a, b) => b.mesh.position.y - a.mesh.position.y);

            let rankHtml = "";
            allChars.forEach((char, index) => {
                let charHeight = Math.max(0, Math.floor(char.mesh.position.y - char.height/2));
                let isPlayer = (char.id === "player");
                let rowClass = isPlayer ? "rank-item player-row" : "rank-item";
                
                let jumpStatusStr = "";
                if (!char.canJumpAfterHit) {
                    jumpStatusStr = `<span class="jump-count locked">[LOCKED]</span>`;
                } else {
                    jumpStatusStr = `<span class="jump-count">[${char.remainingJumps}/${char.maxJumps}]</span>`;
                }

                rankHtml += `<div class="${rowClass}">
                    <span>${index + 1}. ${char.name}${jumpStatusStr}</span>
                    <span>${charHeight}m</span>
                </div>`;
            });
            document.getElementById('rank-list').innerHTML = rankHtml;
            
            if (!player.canJumpAfterHit) {
                document.getElementById('jump-display').innerText = `⚠️ JUMP LOCKED (SILENCED!)`;
                document.getElementById('jump-display').style.color = '#ff1744';
            } else {
                document.getElementById('jump-display').innerText = `Max Jumps: ${player.maxJumps} (Remaining: ${player.remainingJumps})`;
                document.getElementById('jump-display').style.color = '#00e676';
            }

            let punchTimeDiff = now - player.lastPunchTime;
            if (punchTimeDiff < PUNCH_COOLDOWN) {
                let remainingCd = ((PUNCH_COOLDOWN - punchTimeDiff) / 1000).toFixed(1);
                document.getElementById('punch-display').innerText = `PUNCH: RECHARGING (${remainingCd}s)`;
                document.getElementById('punch-display').style.color = '#ff5722';
            } else {
                document.getElementById('punch-display').innerText = `PUNCH: READY (F Key / Left Tap)`;
                document.getElementById('punch-display').style.color = '#00e676';
            }

            let currentHeight = Math.max(0, Math.floor(player.mesh.position.y - player.height/2));
            document.getElementById('height-display').innerText = `Height: ${currentHeight}m`;
        }

        function updatePhysics() {
            updateCharacterPhysics(player, false);
            for (let i = 0; i < npcs.length; i++) {
                updateCharacterPhysics(npcs[i], true);
            }
            handleCharacterCollisions();
            updatePunchVisuals(); 
            updateLeaderboardAndUI();
        }

        onWindowResize = function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            updatePhysics();

            camera.position.x = player.mesh.position.x;
            camera.position.y = player.mesh.position.y + 9;
            camera.position.z = player.mesh.position.z + 20;
            camera.lookAt(player.mesh.position.x, player.mesh.position.y + 1, player.mesh.position.z);

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>

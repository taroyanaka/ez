<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Only Up Clone - Fixed Joystick Movement</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 20px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #height-display {
            font-size: 28px;
            font-weight: bold;
        }

        #game-status {
            font-size: 24px;
            font-weight: bold;
            color: #ffeb3b;
        }

        #mode-toggle-btn {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background-color: #e91e63;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            width: 150px;
        }

        #mode-toggle-btn.auto-mode {
            background-color: #00e676;
            color: #333;
        }

        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            z-index: 10;
        }

        #jump-touch-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 5;
        }
    </style>

    <script src="libs/three.min.js"></script>
    <script src="libs/nipplejs.min.js"></script>
</head>

<body>

    <div id="ui-layer">
        <div id="height-display">Height: 0m</div>
        <div id="game-status"></div>

        <button id="mode-toggle-btn" onclick="toggleMode()">
            MODE: MANUAL
        </button>

        <div style="font-size:14px;margin-top:5px;">
            PC: WASD / Space | Mobile: Stick / Right-Screen Tap
        </div>
    </div>

    <div id="joystick-zone"></div>
    <div id="jump-touch-zone"></div>
    <div id="canvas-container"></div>

    <script>

        // =========================================
        // 設定
        // =========================================

        const PLAYER_SPEED = 0.12;
        const JUMP_FORCE = 0.25;
        const GRAVITY = 0.0098;
        const TOTAL_TILES = 10;

        // ジョイスティック感度
        const STICK_SENSITIVITY = 1;

        // =========================================
        // 状態
        // =========================================

        let scene;
        let camera;
        let renderer;

        let player = {
            mesh: null,
            radius: 0.6,
            height: 1.8,
            velocity: new THREE.Vector3(),
            onGround: false,

            joystickInput: {
                x: 0,
                z: 0
            }
        };

        let platforms = [];
        let keyboard = {};

        let isAutoMode = false;
        let isCleared = false;

        // =========================================
        // 初期化
        // =========================================

        function init() {

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );

            renderer = new THREE.WebGLRenderer({
                antialias: true
            });

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            renderer.shadowMap.enabled = true;

            document
                .getElementById('canvas-container')
                .appendChild(renderer.domElement);

            // ライト

            const ambientLight = new THREE.AmbientLight(
                0xffffff,
                0.6
            );

            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(
                0xffffff,
                0.8
            );

            dirLight.position.set(20, 40, 20);

            dirLight.castShadow = true;

            dirLight.shadow.mapSize.width = 1048;
            dirLight.shadow.mapSize.height = 1048;

            scene.add(dirLight);

            // プレイヤー

            const playerGeo =
                new THREE.CylinderGeometry(
                    player.radius,
                    player.radius,
                    player.height,
                    16
                );

            const playerMat =
                new THREE.MeshLambertMaterial({
                    color: 0xe91e63
                });

            player.mesh =
                new THREE.Mesh(playerGeo, playerMat);

            player.mesh.position.set(
                0,
                player.height / 2,
                0
            );

            player.mesh.castShadow = true;

            scene.add(player.mesh);

            generateStage();

            setupInputs();

            window.addEventListener(
                'resize',
                onWindowResize,
                false
            );

            animate();
        }

        // =========================================
        // ステージ生成
        // =========================================

        function generateStage() {

            createPlatform(
                0,
                -0.5,
                0,
                15,
                1,
                15,
                0x333333,
                false
            );

            let currentX = 0;
            let currentY = 1.0;
            let currentZ = -5;

            for (let i = 1; i < TOTAL_TILES; i++) {

                let w = Math.random() * 3 + 2.0;
                let h = 0.4;
                let d = Math.random() * 3 + 2.0;

                currentX += (Math.random() - 0.5) * 5;
                currentY += (Math.random() * 1.5 + 1.2) * 0.5;
                currentZ += (Math.random() - 0.5) * 5 - 3;

                const colors = [
                    0x4caf50,
                    0x2196f3,
                    0xffeb3b,
                    0xff9800,
                    0x9c27b0
                ];

                const color =
                    colors[
                        Math.floor(Math.random() * colors.length)
                    ];

                createPlatform(
                    currentX,
                    currentY,
                    currentZ,
                    w,
                    h,
                    d,
                    color,
                    false
                );
            }

            currentX += (Math.random() - 0.5) * 3;
            currentY += 1.2;
            currentZ -= 4;

            createPlatform(
                currentX,
                currentY,
                currentZ,
                8,
                0.5,
                8,
                0xffd700,
                true
            );
        }

        function createPlatform(
            x,
            y,
            z,
            w,
            h,
            d,
            color,
            isGoal = false
        ) {

            const geo =
                new THREE.BoxGeometry(w, h, d);

            const mat =
                new THREE.MeshStandardMaterial({
                    color: color,
                    metalness: isGoal ? 0.8 : 0.2,
                    roughness: isGoal ? 0.2 : 0.5
                });

            const mesh =
                new THREE.Mesh(geo, mat);

            mesh.position.set(x, y, z);

            mesh.receiveShadow = true;
            mesh.castShadow = true;

            scene.add(mesh);

            platforms.push({
                mesh: mesh,

                center: new THREE.Vector3(x, y, z),

                min: new THREE.Vector3(
                    x - w / 2,
                    y - h / 2,
                    z - d / 2
                ),

                max: new THREE.Vector3(
                    x + w / 2,
                    y + h / 2,
                    z + d / 2
                ),

                isGoal: isGoal
            });
        }

        // =========================================
        // モード切替
        // =========================================

        function toggleMode() {

            isAutoMode = !isAutoMode;

            const btn =
                document.getElementById('mode-toggle-btn');

            if (isAutoMode) {

                btn.innerText = "MODE: AUTO";

                btn.classList.add('auto-mode');

            } else {

                btn.innerText = "MODE: MANUAL";

                btn.classList.remove('auto-mode');

                player.joystickInput.x = 0;
                player.joystickInput.z = 0;
            }
        }

        // =========================================
        // AI移動
        // =========================================

        function getAutoMovement() {

            let move = { x: 0, z: 0 };

            if (!isAutoMode || isCleared) {
                return move;
            }

            let target = null;
            let minHeightDiff = Infinity;

            const pPos = player.mesh.position;

            for (let i = 0; i < platforms.length; i++) {

                let b = platforms[i];

                let heightDiff =
                    b.center.y -
                    (pPos.y - player.height / 2);

                if (
                    heightDiff > 0.1 &&
                    heightDiff < minHeightDiff
                ) {
                    minHeightDiff = heightDiff;
                    target = b;
                }
            }

            if (!target) return move;

            let diffX =
                target.center.x - pPos.x;

            let diffZ =
                target.center.z - pPos.z;

            let distanceXZ =
                Math.sqrt(diffX * diffX + diffZ * diffZ);

            if (distanceXZ > 0.1) {

                move.x = diffX / distanceXZ;
                move.z = diffZ / distanceXZ;
            }

            if (
                player.onGround &&
                distanceXZ < 6.0
            ) {
                player.velocity.y = JUMP_FORCE;
                player.onGround = false;
            }

            return move;
        }

        // =========================================
        // 入力
        // =========================================

        function setupInputs() {

            // キーボード

            window.addEventListener('keydown', (e) => {
                keyboard[e.code] = true;
            });

            window.addEventListener('keyup', (e) => {
                keyboard[e.code] = false;
            });

            // ジョイスティック

            const joystick = nipplejs.create({
                zone: document.getElementById('joystick-zone'),
                mode: 'static',
                position: {
                    left: '75px',
                    bottom: '75px'
                },
                color: 'white'
            });

            joystick.on('move', (evt, data) => {

                if (!isAutoMode && data.angle) {

                    // WASD互換方向ベクトル

                    let moveX =
                        Math.cos(data.angle.radian);

                    let moveZ =
                        -Math.sin(data.angle.radian);

                    // 倒し量
                    let force =
                        Math.min(data.force || 1, 1);

                    // 正規化

                    const length =
                        Math.sqrt(
                            moveX * moveX +
                            moveZ * moveZ
                        );

                    if (length > 0) {

                        moveX /= length;
                        moveZ /= length;
                    }

                    // 感度適用

                    player.joystickInput.x =
                        moveX *
                        force *
                        STICK_SENSITIVITY;

                    player.joystickInput.z =
                        moveZ *
                        force *
                        STICK_SENSITIVITY;
                }
            });

            joystick.on('end', () => {

                player.joystickInput.x = 0;
                player.joystickInput.z = 0;
            });

            // ジャンプ

            const jumpZone =
                document.getElementById('jump-touch-zone');

            jumpZone.addEventListener(
                'touchstart',
                (e) => {

                    e.preventDefault();

                    if (
                        !isAutoMode &&
                        player.onGround
                    ) {
                        player.velocity.y = JUMP_FORCE;
                        player.onGround = false;
                    }
                },
                { passive: false }
            );
        }

        // =========================================
        // 物理
        // =========================================

        function updatePhysics() {

            let moveX = 0;
            let moveZ = 0;

            if (isAutoMode) {

                let autoMove = getAutoMovement();

                moveX = autoMove.x;
                moveZ = autoMove.z;

            } else {

                // ジョイスティック

                moveX = player.joystickInput.x;
                moveZ = player.joystickInput.z;

                // WASD

                if (keyboard['KeyW'] || keyboard['ArrowUp']) {
                    moveZ = -1;
                }

                if (keyboard['KeyS'] || keyboard['ArrowDown']) {
                    moveZ = 1;
                }

                if (keyboard['KeyA'] || keyboard['ArrowLeft']) {
                    moveX = -1;
                }

                if (keyboard['KeyD'] || keyboard['ArrowRight']) {
                    moveX = 1;
                }

                // WASD斜め移動補正

                if (
                    (keyboard['KeyW'] || keyboard['ArrowUp'] ||
                     keyboard['KeyS'] || keyboard['ArrowDown']) &&

                    (keyboard['KeyA'] || keyboard['ArrowLeft'] ||
                     keyboard['KeyD'] || keyboard['ArrowRight'])
                ) {

                    const length =
                        Math.sqrt(
                            moveX * moveX +
                            moveZ * moveZ
                        );

                    moveX /= length;
                    moveZ /= length;
                }
            }

            // 移動

            player.velocity.x =
                moveX * PLAYER_SPEED;

            player.velocity.z =
                moveZ * PLAYER_SPEED;

            // 重力

            player.velocity.y -= GRAVITY;

            // キーボードジャンプ

            if (
                !isAutoMode &&
                keyboard['Space'] &&
                player.onGround
            ) {
                player.velocity.y = JUMP_FORCE;
                player.onGround = false;
            }

            let nextPos =
                player.mesh.position
                    .clone()
                    .add(player.velocity);

            // 落下

            if (nextPos.y < -20) {
                resetPlayer();
                return;
            }

            // 当たり判定

            let pMinX = nextPos.x - player.radius;
            let pMaxX = nextPos.x + player.radius;

            let pMinZ = nextPos.z - player.radius;
            let pMaxZ = nextPos.z + player.radius;

            let pMaxY =
                nextPos.y + player.height / 2;

            player.onGround = false;

            for (let i = 0; i < platforms.length; i++) {

                let b = platforms[i];

                if (
                    pMaxX > b.min.x &&
                    pMinX < b.max.x &&
                    pMaxZ > b.min.z &&
                    pMinZ < b.max.z &&
                    pMaxY > b.min.y &&
                    (nextPos.y - player.height / 2) < b.max.y
                ) {

                    let prevBottom =
                        player.mesh.position.y -
                        player.height / 2;

                    // 上に乗る

                    if (
                        prevBottom >= b.max.y - 0.3 &&
                        player.velocity.y <= 0
                    ) {

                        player.velocity.y = 0;

                        nextPos.y =
                            b.max.y +
                            player.height / 2;

                        player.onGround = true;

                        if (b.isGoal && !isCleared) {

                            isCleared = true;

                            document.getElementById(
                                'game-status'
                            ).innerText =
                                "🎉 GOAL !! CLEAR !! 🎉";
                        }

                        break;
                    }

                    // 下から頭ぶつける

                    else if (
                        player.mesh.position.y +
                        player.height / 2 <=
                        b.min.y + 0.3 &&
                        player.velocity.y > 0
                    ) {

                        player.velocity.y = 0;

                        nextPos.y =
                            b.min.y -
                            player.height / 2;
                    }

                    // 横衝突

                    else {

                        player.velocity.x = 0;
                        player.velocity.z = 0;
                    }
                }
            }

            player.mesh.position.copy(nextPos);

            // UI更新

            let currentHeight =
                Math.max(
                    0,
                    Math.floor(
                        player.mesh.position.y -
                        player.height / 2
                    )
                );

            document.getElementById(
                'height-display'
            ).innerText =
                `Height: ${currentHeight}m`;
        }

        // =========================================
        // リスポーン
        // =========================================

        function resetPlayer() {

            player.mesh.position.set(
                0,
                player.height / 2,
                0
            );

            player.velocity.set(0, 0, 0);

            player.onGround = true;

            isCleared = false;

            document.getElementById(
                'game-status'
            ).innerText = "";
        }

        // =========================================
        // リサイズ
        // =========================================

        function onWindowResize() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }

        // =========================================
        // ループ
        // =========================================

        function animate() {

            requestAnimationFrame(animate);

            updatePhysics();

            camera.position.x =
                player.mesh.position.x;

            camera.position.y =
                player.mesh.position.y + 6;

            camera.position.z =
                player.mesh.position.z + 12;

            camera.lookAt(
                player.mesh.position.x,
                player.mesh.position.y + 1,
                player.mesh.position.z
            );

            renderer.render(scene, camera);
        }

        window.onload = init;

    </script>
</body>
</html>

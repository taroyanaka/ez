<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Only Up Clone - Adjusted</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* UIレイヤー */
        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 20px;
            pointer-events: none;
        }
        #height-display {
            font-size: 28px;
            font-weight: bold;
        }
        /* スマホ用ジョイスティック配置エリア */
        #joystick-zone {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            z-index: 10;
        }
        /* スマホ用ジャンプボタンエリア（画面右半分） */
        #jump-touch-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            z-index: 5;
        }
    </style>
    <script src="libs/three.min.js"></script>
    <script src="libs/nipplejs.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div id="height-display">Height: 0m</div>
        <div style="font-size: 14px; margin-top: 5px;">PC: WASD / Space | Mobile: Stick / Right-Screen Tap</div>
    </div>
    
    <div id="joystick-zone"></div>
    <div id="jump-touch-zone"></div>
    <div id="canvas-container"></div>

    <script>
        // --- ゲーム設定 ---
        const PLAYER_SPEED = 0.15;
        const JUMP_FORCE = 0.25;
        const GRAVITY = 0.0098;
        
        // --- 状態管理 ---
        let scene, camera, renderer;
        let player = {
            mesh: null,
            radius: 0.6,
            height: 1.8,
            velocity: new THREE.Vector3(),
            onGround: false,
            input: { x: 0, z: 0 }
        };
        let platforms = [];
        let keyboard = {};
        
        // --- 初期化 ---
        function init() {
            // 1. シーン・カメラ・レンダラー
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // 青空
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 2. ライト
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1048;
            dirLight.shadow.mapSize.height = 1048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 150;
            const d = 40;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            // 3. プレイヤーの作成 (簡易的にカプセル/円柱)
            const playerGeo = new THREE.CylinderGeometry(player.radius, player.radius, player.height, 16);
            const playerMat = new THREE.MeshLambertMaterial({ color: 0xe91e63 });
            player.mesh = new THREE.Mesh(playerGeo, playerMat);
            player.mesh.position.set(0, player.height / 2, 0);
            player.mesh.castShadow = true;
            scene.add(player.mesh);

            // 4. ステージ（足場）の自動生成
            generateStage();

            // 5. 入力設定
            setupInputs();

            // ウィンドウリサイズ対応
            window.addEventListener('resize', onWindowResize, false);

            // ループ開始
            animate();
        }

        // --- ステージ生成 (Only Up風に上へ上へと配置) ---
        function generateStage() {
            // スタート地点の床
            createPlatform(0, -0.5, 0, 15, 1, 15, 0x333333);

            let currentX = 0;
            // 最初の足場のスタート高さを 2 から 1 に変更
            let currentY = 1.0; 
            let currentZ = -5;

            // ランダムに100個の足場を上空へ配置
            for (let i = 0; i < 100; i++) {
                let w = Math.random() * 3 + 1.5; // 幅
                let h = Math.random() * 0.5 + 0.2; // 厚み
                let d = Math.random() * 3 + 1.5; // 奥行き

                // 次の足場へのオフセット
                currentX += (Math.random() - 0.5) * 6; // 横の散らばりも少しマイルドに調整
                
                // 【修正】高さを従来の「1.2〜2.7」から「0.6〜1.35」の半分に調整
                currentY += (Math.random() * 1.5 + 1.2) * 0.5; 
                
                currentZ += (Math.random() - 0.5) * 6 - 2;

                // バラエティ豊かな色
                const colors = [0x4caf50, 0x2196f3, 0xffeb3b, 0xff9800, 0x9c27b0, 0x00ffffff];
                const color = colors[Math.floor(Math.random() * colors.length)];

                createPlatform(currentX, currentY, currentZ, w, h, d, color);
            }
        }

        function createPlatform(x, y, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshLambertMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);

            // 衝突判定用にデータ保持 (AABB形式)
            platforms.push({
                mesh: mesh,
                min: new THREE.Vector3(x - w/2, y - h/2, z - d/2),
                max: new THREE.Vector3(x + w/2, y + h/2, z + d/2)
            });
        }

        // --- 入力処理 ---
        function setupInputs() {
            // キーボード (PC用)
            window.addEventListener('keydown', (e) => { keyboard[e.code] = true; });
            window.addEventListener('keyup', (e) => { keyboard[e.code] = false; });

            // Nipple.js (スマホ用ジョイスティック)
            const joystick = nipplejs.create({
                zone: document.getElementById('joystick-zone'),
                mode: 'static',
                position: { left: '75px', bottom: '75px' },
                color: 'white'
            });

            joystick.on('move', (evt, data) => {
                if (data.direction) {
                    player.input.x = Math.cos(data.angle.radial) * (data.distance / 50);
                    player.input.z = -Math.sin(data.angle.radial) * (data.distance / 50);
                }
            });

            joystick.on('end', () => {
                player.input.x = 0;
                player.input.z = 0;
            });

            // スマホ用画面右側タップでジャンプ
            const jumpZone = document.getElementById('jump-touch-zone');
            jumpZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (player.onGround) {
                    player.velocity.y = JUMP_FORCE;
                    player.onGround = false;
                }
            }, { passive: false });
        }

        // --- 物理と衝突判定の計算 ---
        function updatePhysics() {
            let moveX = player.input.x;
            let moveZ = player.input.z;

            if (keyboard['KeyW'] || keyboard['ArrowUp']) moveZ = -1;
            if (keyboard['KeyS'] || keyboard['ArrowDown']) moveZ = 1;
            if (keyboard['KeyA'] || keyboard['ArrowLeft']) moveX = -1;
            if (keyboard['KeyD'] || keyboard['ArrowRight']) moveX = 1;

            if (moveX !== 0 && moveZ !== 0) {
                const length = Math.sqrt(moveX * moveX + moveZ * moveZ);
                moveX /= length;
                moveZ /= length;
            }

            player.velocity.x = moveX * PLAYER_SPEED;
            player.velocity.z = moveZ * PLAYER_SPEED;
            player.velocity.y -= GRAVITY;

            if (keyboard['Space'] && player.onGround) {
                player.velocity.y = JUMP_FORCE;
                player.onGround = false;
            }

            let nextPos = player.mesh.position.clone().add(player.velocity);

            if (nextPos.y < -20) {
                resetPlayer();
                return;
            }

            let pMinX = nextPos.x - player.radius;
            let pMaxX = nextPos.x + player.radius;
            let pMinZ = nextPos.z - player.radius;
            let pMaxZ = nextPos.z + player.radius;
            let pMinY = nextPos.y - player.height / 2;
            let pMaxY = nextPos.y + player.height / 2;

            player.onGround = false;

            for (let i = 0; i < platforms.length; i++) {
                let b = platforms[i];

                if (pMaxX > b.min.x && pMinX < b.max.x &&
                    pMaxZ > b.min.z && pMinZ < b.max.z &&
                    pMaxY > b.min.y && pMinY < b.max.y) {
                    
                    let prevBottom = player.mesh.position.y - player.height / 2;
                    if (prevBottom >= b.max.y - 0.3 && player.velocity.y <= 0) {
                        player.velocity.y = 0;
                        nextPos.y = b.max.y + player.height / 2;
                        player.onGround = true;
                        break;
                    } 
                    else if (player.mesh.position.y + player.height/2 <= b.min.y + 0.3 && player.velocity.y > 0) {
                        player.velocity.y = 0;
                        nextPos.y = b.min.y - player.height / 2;
                    }
                    else {
                        player.velocity.x = 0;
                        player.velocity.z = 0;
                    }
                }
            }

            player.mesh.position.copy(nextPos);

            let currentHeight = Math.max(0, Math.floor(player.mesh.position.y - player.height/2));
            document.getElementById('height-display').innerText = `Height: ${currentHeight}m`;
        }

        function resetPlayer() {
            player.mesh.position.set(0, player.height / 2, 0);
            player.velocity.set(0, 0, 0);
            player.onGround = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            updatePhysics();

            camera.position.x = player.mesh.position.x;
            camera.position.y = player.mesh.position.y + 6;
            camera.position.z = player.mesh.position.z + 12;
            camera.lookAt(player.mesh.position.x, player.mesh.position.y + 1, player.mesh.position.z);

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>

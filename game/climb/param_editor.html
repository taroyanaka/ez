<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>param.txt Editor</title>
  <style>
    :root { --bg:#0f172a; --panel:#111827; --line:#334155; --text:#e5e7eb; --muted:#94a3b8; --accent:#22c55e; --danger:#ef4444; --warn:#f59e0b; }
    body { margin:0; font-family:system-ui, sans-serif; background:linear-gradient(180deg,#020617,#0f172a 45%,#111827); color:var(--text); }
    header { padding:20px; border-bottom:1px solid rgba(255,255,255,0.08); }
    h1 { margin:0 0 8px; font-size:22px; }
    .wrap { display:grid; grid-template-columns: 1fr 1.1fr; gap:16px; padding:16px; }
    .panel { background:rgba(17,24,39,0.92); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,0.25); }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    button, input, textarea { font:inherit; }
    button { border:0; border-radius:10px; padding:10px 12px; cursor:pointer; background:#334155; color:var(--text); }
    button.primary { background:var(--accent); color:#052e16; font-weight:700; }
    button.danger { background:var(--danger); }
    button.warn { background:var(--warn); color:#1f1300; }
    button.ghost { background:transparent; border:1px solid rgba(255,255,255,0.12); }
    input, textarea, select { width:100%; box-sizing:border-box; border-radius:10px; border:1px solid var(--line); background:#0b1220; color:var(--text); padding:10px 12px; }
    textarea { min-height:120px; resize:vertical; }
    .rows { display:flex; flex-direction:column; gap:10px; }
    .row { border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:10px; background:rgba(2,6,23,0.35); }
    .row-head { display:flex; gap:8px; margin-bottom:8px; }
    .row-head input { flex:1; }
    .row-meta { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; align-items:start; }
    .small { font-size:12px; color:var(--muted); line-height:1.5; }
    .links { display:flex; flex-direction:column; gap:8px; }
    .link-item { display:flex; gap:8px; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid rgba(255,255,255,0.08); border-radius:10px; background:rgba(2,6,23,0.25); }
    .link-item a { color:#93c5fd; text-decoration:none; font-weight:700; }
    .split { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    @media (max-width: 980px) { .wrap { grid-template-columns:1fr; } .row-meta { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>param.txt Editor</h1>
    <div class="small">`param.txt` を読み込み、行ごとに追加・削除・編集できます。各行の起動リンクは `AUTO_MODE=1` を付けて開きます。</div>
  </header>

  <div class="wrap">
    <section class="panel">
      <div class="toolbar">
        <button class="primary" id="loadBtn">Reload</button>
        <button id="addBtn">Add Row</button>
        <button class="warn" id="saveBtn">Save</button>
        <button class="ghost" id="downloadBtn">Download</button>
      </div>
      <div class="split" style="margin-bottom:12px;">
        <div>
          <label class="small">param.txt path</label>
          <input id="filePath" value="param.txt">
        </div>
        <div>
          <label class="small">Launch page</label>
          <input id="launchPage" value="climb11-6.html">
        </div>
      </div>
      <div class="small" style="margin-bottom:8px;">行形式: `表示名,PARAMS`。PARAMSは `A=1&B=2&SHOP_ITEMS=1:10:#8bc34a|2:20:#0288d1` のように書けます。</div>
      <div id="rows" class="rows"></div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <button class="primary" id="applyBtn">Apply Preview</button>
        <button id="copyBtn">Copy Text</button>
      </div>
      <label class="small">Generated text</label>
      <textarea id="preview"></textarea>
      <div style="height:14px"></div>
      <div class="small">Launch links</div>
      <div id="links" class="links" style="margin-top:8px;"></div>
    </section>
  </div>

  <template id="rowTpl">
    <div class="row">
      <div class="row-head">
        <input class="label" placeholder="label">
        <button class="danger removeBtn">Delete</button>
      </div>
      <div class="row-meta">
        <div>
          <label class="small">params</label>
          <textarea class="params" placeholder="NPC_COUNT=3&TOTAL_TILES=10&AUTO_MODE=1"></textarea>
        </div>
        <div>
          <label class="small">auto launch</label>
          <select class="autoMode">
            <option value="1">AUTO</option>
            <option value="0">MANUAL</option>
          </select>
        </div>
        <div>
          <label class="small">shop items preset</label>
          <textarea class="shop" placeholder="1:10:#8bc34a|2:20:#0288d1"></textarea>
        </div>
        <div>
          <label class="small">action</label>
          <button class="ghost launchBtn" style="width:100%;">Launch</button>
        </div>
      </div>
    </div>
  </template>

  <script>
    const rowsEl = document.getElementById('rows');
    const previewEl = document.getElementById('preview');
    const linksEl = document.getElementById('links');
    const rowTpl = document.getElementById('rowTpl');
    const filePathEl = document.getElementById('filePath');
    const launchPageEl = document.getElementById('launchPage');

    function parseLines(text) {
      return String(text || '').split(/\r?\n/).map(v => v.trim()).filter(Boolean).map(line => {
        const idx = line.indexOf(',');
        if (idx < 0) return { label: line, params: '', autoMode: '1', shop: '' };
        return { label: line.slice(0, idx), params: line.slice(idx + 1), autoMode: '1', shop: '' };
      });
    }

    function serializeRows() {
      return [...rowsEl.querySelectorAll('.row')].map(row => {
        const label = row.querySelector('.label').value.trim();
        const params = row.querySelector('.params').value.trim();
        const autoMode = row.querySelector('.autoMode').value;
        const shop = row.querySelector('.shop').value.trim();
        const list = [];
        if (params) list.push(params.replace(/&?AUTO_MODE=[^&]*/g, '').replace(/^&+|&+$/g, ''));
        if (shop) list.push(`SHOP_ITEMS=${shop}`);
        if (autoMode === '1' && !/AUTO_MODE=/.test(list.join('&'))) list.push('AUTO_MODE=1');
        return `${label},${list.filter(Boolean).join('&')}`;
      }).filter(v => v.trim() && !v.endsWith(','));
    }

    function renderRows(items) {
      rowsEl.innerHTML = '';
      items.forEach(item => addRow(item));
      updatePreview();
    }

    function addRow(item = { label: 'new-param', params: 'AUTO_MODE=1', autoMode: '1', shop: '' }) {
      const node = rowTpl.content.firstElementChild.cloneNode(true);
      node.querySelector('.label').value = item.label || '';
      node.querySelector('.params').value = item.params || '';
      node.querySelector('.autoMode').value = item.autoMode || (/AUTO_MODE=1/.test(item.params || '') ? '1' : '0');
      node.querySelector('.shop').value = item.shop || '';
      node.querySelector('.removeBtn').addEventListener('click', () => { node.remove(); updatePreview(); });
      node.querySelector('.launchBtn').addEventListener('click', () => launchRow(node));
      node.querySelectorAll('input, textarea, select').forEach(el => el.addEventListener('input', updatePreview));
      rowsEl.appendChild(node);
    }

    function buildLaunchUrl(row) {
      const params = row.querySelector('.params').value.trim();
      const shop = row.querySelector('.shop').value.trim();
      const autoMode = row.querySelector('.autoMode').value === '1';
      const chunks = [];
      if (params) chunks.push(params.replace(/&?AUTO_MODE=[^&]*/g, '').replace(/^&+|&+$/g, ''));
      if (shop) chunks.push(`SHOP_ITEMS=${encodeURIComponent(shop)}`);
      if (autoMode) chunks.push('AUTO_MODE=1');
      return `${launchPageEl.value}?${chunks.filter(Boolean).join('&')}`;
    }

    function launchRow(row) {
      window.open(buildLaunchUrl(row), '_blank', 'noopener');
    }

    function updatePreview() {
      const lines = serializeRows();
      previewEl.value = lines.join('\n');
      linksEl.innerHTML = '';
      [...rowsEl.querySelectorAll('.row')].forEach(row => {
        const label = row.querySelector('.label').value.trim() || '(unnamed)';
        const url = buildLaunchUrl(row);
        const item = document.createElement('div');
        item.className = 'link-item';
        item.innerHTML = `<a href="${url}" target="_blank" rel="noopener">${label}</a><span class="small">AUTO launch</span>`;
        linksEl.appendChild(item);
      });
    }

    async function loadText() {
      const res = await fetch(filePathEl.value);
      if (!res.ok) throw new Error(`Failed to load ${filePathEl.value}`);
      return await res.text();
    }

    async function saveText(text) {
      if ('showSaveFilePicker' in window) {
        const handle = await window.showSaveFilePicker({
          suggestedName: filePathEl.value,
          types: [{ description: 'Text', accept: { 'text/plain': ['.txt'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(text);
        await writable.close();
        return;
      }
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filePathEl.value.split(/[\\/]/).pop();
      a.click();
      URL.revokeObjectURL(a.href);
    }

    document.getElementById('loadBtn').addEventListener('click', async () => {
      try { renderRows(parseLines(await loadText())); }
      catch (e) { alert(e.message); }
    });
    document.getElementById('addBtn').addEventListener('click', () => { addRow(); updatePreview(); });
    document.getElementById('applyBtn').addEventListener('click', updatePreview);
    document.getElementById('copyBtn').addEventListener('click', async () => {
      await navigator.clipboard.writeText(previewEl.value);
    });
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const text = serializeRows().join('\n');
      await saveText(text);
      previewEl.value = text;
    });
    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const text = serializeRows().join('\n');
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'param.txt';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    loadText().then(text => renderRows(parseLines(text))).catch(() => renderRows([
      { label: 'short-test', params: 'NPC_COUNT=3&TOTAL_TILES=10&PLAYER_SPEED=0.12&AUTO_MODE=1', autoMode: '1', shop: '' }
    ]));
  </script>
</body>
</html>

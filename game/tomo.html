<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Dローポリ・マイルーム＆アバターライフ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #eef2f7; overflow: hidden; }

        #game-container { position: relative; width: 100vw; height: 100vh; }
        #canvas3d { width: 100%; height: 100%; display: block; }

        .ui-layer { position: absolute; pointer-events: none; width: 100%; height: 100%; top: 0; left: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 12px; }
        .ui-panel { background: rgba(255, 255, 255, 0.95); padding: 12px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); pointer-events: auto; }

        .header-panel { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .title-box h1 { font-size: 15px; color: #333; }
        .title-box p { font-size: 11px; color: #777; }

        /* 左側：着せ替え専用パネル */
        .avatar-panel { position: absolute; left: 15px; top: 85px; width: 160px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
        .avatar-panel h2 { font-size: 12px; color: #333; border-bottom: 2px solid #ddd; padding-bottom: 4px; }
        .select-group { display: flex; flex-direction: column; gap: 3px; margin-bottom: 5px; }
        .select-group label { font-size: 10px; font-weight: bold; color: #666; }
        .custom-select { width: 100%; padding: 6px; font-size: 11px; border-radius: 6px; border: 1px solid #ccc; background: white; font-weight: bold; }

        /* 下部コントロール */
        .main-controls { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 440px; margin: 0 auto; }
        
        .control-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 140px; margin: 0 auto; }
        .btn { background: #4caf50; color: white; border: none; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; box-shadow: 0 4px 0 #388e3c; font-size: 13px; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #388e3c; }
        .btn.disabled { background: #ccc !important; box-shadow: 0 4px 0 #999 !important; cursor: not-allowed; transform: none !important; }
        .btn-rotate { background: #2196f3; box-shadow: 0 4px 0 #1976d2; }
        .btn-delete { background: #f44336; box-shadow: 0 4px 0 #d32f2f; grid-column: span 3; font-size: 11px; padding: 6px; }

        .category-tabs { display: flex; gap: 4px; margin-bottom: 4px; }
        .tab-btn { flex: 1; padding: 6px; font-size: 11px; border: none; background: #e0e0e0; border-radius: 8px; cursor: pointer; font-weight: bold; color: #555; }
        .tab-btn.active { background: #333; color: white; }

        .inventory-box { display: flex; flex-direction: column; }
        .status-bar { font-size: 11px; font-weight: bold; color: #555; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .item-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; min-height: 75px; }
        .item-card { flex: 0 0 70px; height: 70px; background: #f5f5f5; border: 3px solid transparent; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
        .item-card.selected { border-color: #2196f3; background: #e3f2fd; }
        .item-icon { font-size: 20px; }

        #toast { position: absolute; top: 12%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; text-align: center; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas3d"></canvas>
    <div id="toast">メッセージ</div>

    <div class="ui-panel avatar-panel">
        <h2>🕺 アバター着せ替え</h2>
        <div class="select-group">
            <label>性別</label>
            <select id="av-gender" class="custom-select" onchange="updateAvatarAppearance()">
                <option value="male">男の子 (Male)</option>
                <option value="female">女の子 (Female)</option>
            </select>
        </div>
        <div class="select-group">
            <label>髪型</label>
            <select id="av-hair" class="custom-select" onchange="updateAvatarAppearance()">
                <option value="0">スタイル A</option>
                <option value="1">スタイル B</option>
                <option value="2">スタイル C</option>
            </select>
        </div>
        <div class="select-group">
            <label>トップス (上着)</label>
            <select id="av-top" class="custom-select" onchange="updateAvatarAppearance()">
                <option value="0">カジュアルシャツ</option>
                <option value="1">無地パーカー</option>
            </select>
        </div>
        <div class="select-group">
            <label>ボトムス (ズボン)</label>
            <select id="av-bottom" class="custom-select" onchange="updateAvatarAppearance()">
                <option value="0">定番ジーンズ</option>
                <option value="1">ハーフパンツ</option>
            </select>
        </div>
    </div>

    <div class="ui-layer">
        <div class="ui-panel header-panel">
            <div class="title-box">
                <h1>🏡 ルーム＆マイクラ風アバター</h1>
                <p id="mode-indicator" style="color: #4caf50; font-weight: bold;">【生活モード】キャラお散歩中</p>
            </div>
            <button class="tab-btn" style="flex:none; width:80px; background:#ff9800; color:white;" onclick="resetRoom()">全部リセット</button>
        </div>

        <div class="main-controls">
            <div class="ui-panel" style="padding: 6px;">
                <div class="control-pad">
                    <div></div><button class="btn" id="ctrl-up" onclick="moveItem(0, -0.2)">▲</button><div></div>
                    <button class="btn" id="ctrl-left" onclick="moveItem(-0.2, 0)">◀</button>
                    <button class="btn btn-rotate" id="ctrl-rot" onclick="rotateItem()">↻ 回転</button>
                    <button class="btn" id="ctrl-right" onclick="moveItem(0.2, 0)">▶</button>
                    <div></div><button class="btn" id="ctrl-down" onclick="moveItem(0, 0.2)">▼</button><div></div>
                    <button class="btn btn-delete" id="ctrl-del" onclick="deleteItem()">✕ この家具を片付ける</button>
                </div>
            </div>

            <div class="ui-panel inventory-box">
                <div class="category-tabs">
                    <button class="tab-btn active" id="tab-furniture" onclick="switchCategory('furniture')">🪑 家具</button>
                    <button class="tab-btn" id="tab-nature" onclick="switchCategory('nature')">🪴 植物</button>
                    <button class="tab-btn" id="tab-interior" onclick="switchCategory('interior')">🎁 小物</button>
                </div>
                <div class="status-bar">
                    <span id="selected-info" style="color:#2196f3;">家具を選ぶとエディット開始</span>
                </div>
                <div class="item-list" id="inventory-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
// ==========================================
// 1. カラーカタログ・パーツ定義 (男女 計14種対応)
// ==========================================
const AVATAR_COLORS = {
    skin: 0xffdbac,
    male: {
        hairs: [0x5c4033, 0x2c3e50, 0xd4af37], // ショート茶、黒、金
        tops: [0x2980b9, 0xc0392b],           // 青シャツ、赤パーカー
        bottoms: [0x34495e, 0x7f8c8d]        // 濃紺デニム、グレーハーフ
    },
    female: {
        hairs: [0x8e44ad, 0xe67e22, 0x34495e], // パープルボブ、オレンジポニテ、黒髪
        tops: [0xf1c40f, 0x1abc9c],           // 黄色シャツ、ミントパーカー
        bottoms: [0xd35400, 0xbdc3c7]        // ブラウンタイツ、白スカート風
    }
};

const ITEM_MASTER = {
    furniture: {
        'chair': { name: '木のイス', icon: '🪑', color: 0xd7ccc8, size: 0.6 },
        'sofa': { name: 'ソファ', icon: '🛋️', color: 0x90caf9, size: 1.2 },
        'table': { name: 'ローテーブル', icon: '🪵', color: 0xa1887f, size: 1.0 },
        'bed': { name: '大きなベッド', icon: '🛏️', color: 0xffe082, size: 1.4 }
    },
    nature: {
        'plant': { name: '観葉植物', icon: '🪴', color: 0x4caf50, size: 0.5 },
        'cactus': { name: 'サボテン', icon: '🌵', color: 0x2e7d32, size: 0.4 },
        'flower': { name: '一輪挿し', icon: '🌹', color: 0xe91e63, size: 0.3 }
    },
    interior: {
        'giftbox': { name: 'ギフト箱', icon: '🎁', color: 0xff5252, size: 0.4 },
        'lamp': { name: 'スタンドライト', icon: '💡', color: 0xffeb3b, size: 0.4 },
        'plush': { name: 'ぬいぐるみ', icon: '🧸', color: 0xffb74d, size: 0.4 }
    }
};

let currentCategory = 'furniture';
let selectedMesh = null; // エディット中の家具
let avatarGroup = null;  // 3Dアバターのルート
const roomSize = 5;

// アバターのAI歩行用ステート
let avatarAI = { x: 0, z: 0, targetX: 0, targetZ: 0, speed: 0.03, waitTime: 0, isWalking: false };

// ==========================================
// 2. Three.js 初期化
// ==========================================
let scene, camera, renderer, raycaster, mouse;

function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xeef2f7);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 6.0, 7.5);
    camera.lookAt(0, 0.3, 0);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;

    raycaster = new THREE.Raycaster();
    mouse = new THREE.Vector2();

    // ライト群
    scene.add(new THREE.AmbientLight(0xffffff, 0.65));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.45);
    dirLight.position.set(4, 9, 4);
    dirLight.castShadow = true;
    scene.add(dirLight);

    createRoom();
    
    // 最初のアバターを生成して配置
    spawnAvatarSafely();

    // メインループ
    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now();

        // エディット中：家具をバウンドさせる
        if (selectedMesh) {
            selectedMesh.position.y = 0.15 + Math.sin(time * 0.006) * 0.04;
        }

        // 生活モード中：アバターのAI移動と手足アニメーション
        if (!selectedMesh && avatarGroup) {
            handleAvatarAI(time);
        }

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('pointerdown', onPointerDown);
}

function createRoom() {
    const floor = new THREE.Mesh(new THREE.BoxGeometry(roomSize, 0.2, roomSize), new THREE.MeshLambertMaterial({ color: 0xffecb3 }));
    floor.position.y = -0.1;
    floor.receiveShadow = true;
    scene.add(floor);

    const wallMat = new THREE.MeshLambertMaterial({ color: 0xb2dfdb });
    const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 3, roomSize), wallMat);
    wallL.position.set(-roomSize/2, 1.5, 0);
    scene.add(wallL);

    const wallR = new THREE.Mesh(new THREE.BoxGeometry(roomSize, 3, 0.1), wallMat);
    wallR.position.set(0, 1.5, -roomSize/2);
    scene.add(wallR);
}

// ==========================================
// 3. マイクラ風（ボックス形式）アバター生成システム
// ==========================================
function buildMinecraftAvatar() {
    const root = new THREE.Group();

    // UIから現在のカスタム設定を取得
    const gender = document.getElementById('av-gender').value;
    const hairIdx = parseInt(document.getElementById('av-hair').value);
    const topIdx = parseInt(document.getElementById('av-top').value);
    const botIdx = parseInt(document.getElementById('av-bottom').value);

    // 色データの選定
    const palette = AVATAR_COLORS[gender];
    const skinMat = new THREE.MeshLambertMaterial({ color: AVATAR_COLORS.skin });
    const hairMat = new THREE.MeshLambertMaterial({ color: palette.hairs[hairIdx] });
    const topMat = new THREE.MeshLambertMaterial({ color: palette.tops[topIdx] });
    const botMat = new THREE.MeshLambertMaterial({ color: palette.bottoms[botIdx] });
    const eyeMat = new THREE.MeshLambertMaterial({ color: 0x333333 });

    // --- ① 胴体 (Body) ---
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.45, 0.18), topMat);
    body.position.y = 0.525; // 脚の上
    root.add(body);

    // --- ② 頭 (Head) ---
    const headGroup = new THREE.Group();
    headGroup.position.y = 0.75; // 胴体の上
    
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.26, 0.26), skinMat);
    head.position.y = 0.13;
    headGroup.add(head);

    // 目 (マイクラ風四角形)
    const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.03, 0.02), eyeMat);
    eyeL.position.set(0.06, 0.14, 0.131);
    const eyeR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.03, 0.02), eyeMat);
    eyeR.position.set(-0.06, 0.14, 0.131);
    headGroup.add(eyeL, eyeR);

    // 髪の毛 (選択したスタイルに応じて形状チェンジ)
    const hairTop = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.06, 0.28), hairMat);
    hairTop.position.y = 0.24;
    headGroup.add(hairTop);

    if (hairIdx === 1 || gender === 'female') { // ポニテまたはロング系表現のサイド髪
        const hairBack = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.18, 0.06), hairMat);
        hairBack.position.set(0, 0.1, -0.12);
        headGroup.add(hairBack);
    }
    if (hairIdx === 2) { // 横髪・ボブ風ツイン
        const hairL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.14, 0.24), hairMat);
        hairL.position.set(0.14, 0.1, 0.01);
        const hairR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.14, 0.24), hairMat);
        hairR.position.set(-0.14, 0.1, 0.01);
        headGroup.add(hairL, hairR);
    }
    root.add(headGroup);

    // --- ③ 腕 (Arms) ---
    const armL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.42, 0.1), topMat);
    armL.position.set(0.23, 0.525, 0);
    root.add(armL);

    const armR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.42, 0.1), topMat);
    armR.position.set(-0.23, 0.525, 0);
    root.add(armR);

    // --- ④ 脚 (Legs) ---
    // アニメーションさせやすいようにピボット（付け根のグループ）を作る
    const legLGroup = new THREE.Group();
    legLGroup.position.set(0.09, 0.3, 0);
    const legL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.3, 0.12), botMat);
    legL.position.y = -0.15;
    legLGroup.add(legL);
    root.add(legLGroup);

    const legRGroup = new THREE.Group();
    legRGroup.position.set(-0.09, 0.3, 0);
    const legR = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.3, 0.12), botMat);
    legR.position.y = -0.15;
    legRGroup.add(legR);
    root.add(legRGroup);

    // 全パーツに影設定
    root.traverse(child => {
        if(child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
    });

    // キャラベルド参照用リンク
    root.userData = { legL: legLGroup, legR: legRGroup, armL: armL, armR: armR, isAvatar: true };
    return root;
}

// セレクトボックスが変更されたら見た目を即時再ビルド
function updateAvatarAppearance() {
    if (!avatarGroup) return;
    
    // 位置と回転を引き継ぐ
    const currentX = avatarGroup.position.x;
    const currentZ = avatarGroup.position.z;
    const currentRot = avatarGroup.rotation.y;

    scene.remove(avatarGroup);
    
    avatarGroup = buildMinecraftAvatar();
    avatarGroup.position.set(currentX, 0, currentZ);
    avatarGroup.rotation.y = currentRot;
    
    // エディット中でなければシーンに出す
    if (!selectedMesh) {
        scene.add(avatarGroup);
    }
}

// ==========================================
// 4. 【重要】バグ防止：安全ポップ位置探索ロジック
// ==========================================
function spawnAvatarSafely() {
    // 既存アバターを一時削除
    if(avatarGroup) scene.remove(avatarGroup);

    avatarGroup = buildMinecraftAvatar();

    // 部屋に置かれている家具のリストを集める
    const furnitureList = [];
    scene.traverse(child => {
        if (child.userData && child.userData.isPlacedItem && child !== selectedMesh) {
            // マスターデータから当たり判定用のサイズを取得
            const type = child.userData.type;
            const size = ITEM_MASTER[currentCategory][type] ? ITEM_MASTER[currentCategory][type].size : ITEM_MASTER.furniture[type].size;
            furnitureList.push({
                x: child.position.x,
                z: child.position.z,
                radius: size / 2 + 0.3 // 家具の半径 + キャラ自身の身幅マージン
            });
        }
    });

    // 安全な空きポジションを探す（グリッド状にサンプリングして、どの家具とも被らない座標を決定）
    let foundSafeSpot = false;
    let spawnX = 0;
    let spawnZ = 0;

    // 乱数で何回かチャレンジして家具から離れた場所を見つける（手軽かつ有効なアプローチ）
    for (let attempt = 0; attempt < 50; attempt++) {
        // 壁の内側のランダム位置
        let testX = (Math.random() - 0.5) * (roomSize - 1.0);
        let testZ = (Math.random() - 0.5) * (roomSize - 1.0);

        let isOverlap = false;
        for (let f of furnitureList) {
            let dist = Math.sqrt((testX - f.x)**2 + (testZ - f.z)**2);
            if (dist < f.radius) {
                isOverlap = true;
                break;
            }
        }

        if (!isOverlap) {
            spawnX = testX;
            spawnZ = testZ;
            foundSafeSpot = true;
            break;
        }
    }

    // もし家具が満杯で安全地帯が見つからなかった場合は、部屋の中央（0,0）を最終救済値とする
    if (!foundSafeSpot) {
        spawnX = 0;
        spawnZ = 0;
    }

    // アバターを安全地にワープさせてポップ
    avatarAI.x = spawnX;
    avatarAI.z = spawnZ;
    avatarAI.targetX = spawnX;
    avatarAI.targetZ = spawnZ;
    avatarAI.isWalking = false;
    avatarAI.waitTime = Date.now() + 1000;

    avatarGroup.position.set(spawnX, 0, spawnZ);
    
    // エディット中でなければ即時表示
    if (!selectedMesh) {
        scene.add(avatarGroup);
        document.getElementById('mode-indicator').innerText = "【生活モード】キャラお散歩中";
        document.getElementById('mode-indicator').style.color = "#4caf50";
    }
}

// ==========================================
// 5. アバターの自律AI移動 & 手足連動歩行
// ==========================================
function handleAvatarAI(time) {
    if (time < avatarAI.waitTime) {
        // 待機中：手足を直立に戻す
        avatarGroup.userData.legL.rotation.x = 0;
        avatarGroup.userData.legR.rotation.x = 0;
        avatarGroup.userData.armL.rotation.x = 0;
        avatarGroup.userData.armR.rotation.x = 0;
        avatarAI.isWalking = false;
        return;
    }

    // 新しい目的地を決める
    if (!avatarAI.isWalking) {
        avatarAI.targetX = (Math.random() - 0.5) * (roomSize - 1.2);
        avatarAI.targetZ = (Math.random() - 0.5) * (roomSize - 1.2);
        avatarAI.isWalking = true;
    }

    // 目的地への方向と距離を計算
    let dx = avatarAI.targetX - avatarGroup.position.x;
    let dz = avatarAI.targetZ - avatarGroup.position.z;
    let distance = Math.sqrt(dx*dx + dz*dz);

    if (distance < 0.1) {
        // 目的地に到着したら数秒立ち止まる
        avatarAI.isWalking = false;
        avatarAI.waitTime = time + Math.random() * 3000 + 1500; // 1.5〜4.5秒待機
        return;
    }

    // そちらの方向を向く
    let angle = Math.atan2(dx, dz);
    avatarGroup.rotation.y = angle;

    // 前進
    avatarGroup.position.x += (dx / distance) * avatarAI.speed;
    avatarGroup.position.z += (dz / distance) * avatarAI.speed;

    // マイクラ風の手足スイングアニメーション
    let swing = Math.sin(time * 0.01) * 0.6;
    avatarGroup.userData.legL.rotation.x = swing;
    avatarGroup.userData.legR.rotation.x = -swing;
    avatarGroup.userData.armL.rotation.x = -swing;
    avatarGroup.userData.armR.rotation.x = swing;
}

// ==========================================
// 6. 家具の配置・エディット制御
// ==========================================
function switchCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.category-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`tab-${cat}`).classList.add('active');
    renderCatalog();
}

function renderCatalog() {
    const list = document.getElementById('inventory-list');
    list.innerHTML = '';
    const items = ITEM_MASTER[currentCategory];
    Object.keys(items).forEach(id => {
        const item = items[id];
        const card = document.createElement('div');
        card.className = 'item-card';
        card.onclick = () => startEditingNewItem(id);
        card.innerHTML = `<div class="item-icon">${item.icon}</div><div>${item.name}</div>`;
        list.appendChild(card);
    });
    updateControlPanelStatus();
}

// 【仕様】エディット開始時にキャラを非表示にする
function startEditingNewItem(type) {
    if (selectedMesh) selectedMesh.position.y = 0;

    // アバターを非表示化（エディット集中）
    if(avatarGroup) scene.remove(avatarGroup);
    document.getElementById('mode-indicator').innerText = "【エディットモード】配置を確定するとキャラがポップします";
    document.getElementById('mode-indicator').style.color = "#2196f3";

    const newMesh = createLowPolyModel(type);
    scene.add(newMesh);
    selectedMesh = newMesh;
    
    document.getElementById('selected-info').innerText = `配置中: ${ITEM_MASTER[currentCategory][type].name}`;
    updateControlPanelStatus();
}

function moveItem(dx, dz) {
    if (!selectedMesh) return;
    let newX = selectedMesh.position.x + dx;
    let newZ = selectedMesh.position.z + dz;
    const limit = (roomSize / 2) - 0.3;
    if (newX < -limit || newX > limit || newZ < -limit || newZ > limit) return;
    selectedMesh.position.x = newX;
    selectedMesh.position.z = newZ;
}

function rotateItem() { if (selectedMesh) selectedMesh.rotation.y += Math.PI / 2; }

function deleteItem() {
    if (!selectedMesh) return;
    scene.remove(selectedMesh);
    selectedMesh = null;
    document.getElementById('selected-info').innerText = "家具を選んでね";
    updateControlPanelStatus();
    
    // 片付けたら生活モードに戻す（安全地にポップ）
    spawnAvatarSafely();
}

function resetRoom() {
    if(confirm("すべてクリアしますか？")) {
        const toRemove = [];
        scene.traverse(child => { if (child.userData && child.userData.isPlacedItem) toRemove.push(child); });
        toRemove.forEach(mesh => scene.remove(mesh));
        selectedMesh = null;
        document.getElementById('selected-info').innerText = "家具を選んでね";
        updateControlPanelStatus();
        spawnAvatarSafely();
    }
}

// 配置確定・再選択のポインタ処理
function onPointerDown(event) {
    if (event.target.closest('.ui-panel') || event.target.closest('.avatar-panel')) return;

    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(scene.children, true);

    if (intersects.length > 0) {
        let target = intersects[0].object;
        while (target.parent && !target.userData.isPlacedItem) { target = target.parent; }

        // 設置済み家具のタップ（再選択＝エディットモード突入）
        if (target.userData && target.userData.isPlacedItem) {
            if (selectedMesh) selectedMesh.position.y = 0;
            
            // アバターを一旦消す
            if(avatarGroup) scene.remove(avatarGroup);
            document.getElementById('mode-indicator').innerText = "【エディットモード】";
            document.getElementById('mode-indicator').style.color = "#2196f3";

            selectedMesh = target;
            document.getElementById('selected-info').innerText = `再配置中...`;
            updateControlPanelStatus();
            return;
        }
    }

    // 何もない床をタップ：配置確定 ⇒ 【生活モード移行：キャラが安全地帯にポップ】
    if (selectedMesh) {
        selectedMesh.position.y = 0;
        selectedMesh = null;
        document.getElementById('selected-info').innerText = "配置を確定しました";
        updateControlPanelStatus();
        
        // 安全ロジックを通してポップ
        spawnAvatarSafely();
    }
}

function updateControlPanelStatus() {
    const hasActive = selectedMesh !== null;
    ['ctrl-up', 'ctrl-down', 'ctrl-left', 'ctrl-right', 'ctrl-rot', 'ctrl-del'].forEach(btnId => {
        document.getElementById(btnId).classList.toggle('disabled', !hasActive);
    });
}

// 家具モデルの生成補助
function createLowPolyModel(type) {
    let info = null;
    Object.keys(ITEM_MASTER).forEach(cat => { if(ITEM_MASTER[cat][type]) info = ITEM_MASTER[cat][type]; });
    const group = new THREE.Group();
    const mat = new THREE.MeshLambertMaterial({color: info.color});
    const woodMat = new THREE.MeshLambertMaterial({color: 0x8d6e63});

    if (type === 'chair') {
        const seat = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.05, 0.4), mat); seat.position.y = 0.2;
        group.add(seat);
        for(let i=0; i<4; i++) {
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.2, 0.04), woodMat);
            leg.position.set(i<2?0.16:-0.16, 0.1, i%2===0?0.16:-0.16); group.add(leg);
        }
    } else if (type === 'sofa') {
        const base = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.15, 0.5), mat); base.position.y = 0.1;
        const back = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.3, 0.1), mat); back.position.set(0, 0.25, -0.2);
        group.add(base, back);
    } else if (type === 'table') {
        const top = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.5), woodMat); top.position.y = 0.2;
        group.add(top);
        for(let i=0; i<4; i++) {
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.2, 0.04), woodMat);
            leg.position.set(i<2?0.36:-0.36, 0.1, i%2===0?0.2:-0.2); group.add(leg);
        }
    } else if (type === 'bed') {
        const frame = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.12, 1.2), woodMat); frame.position.y = 0.06;
        const matress = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.15, 1.1), new THREE.MeshLambertMaterial({color: 0xffffff})); matress.position.set(0, 0.12, 0.04);
        group.add(frame, matress);
    } else if (type === 'plant') {
        const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.1, 0.2, 5), new THREE.MeshLambertMaterial({color: 0xffcc80})); pot.position.y = 0.1;
        const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(0.24, 0), mat); leaves.position.y = 0.35;
        group.add(pot, leaves);
    } else {
        // その他小物（簡易共通ボックス）
        const box = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), mat); box.position.y = 0.15;
        group.add(box);
    }

    group.userData = { type: type, isPlacedItem: true };
    group.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
    return group;
}

function showToast(msg) {
    const toast = document.getElementById('toast'); toast.innerText = msg; toast.style.opacity = 1;
    setTimeout(() => { toast.style.opacity = 0; }, 2000);
}

window.onload = () => { init3D(); renderCatalog(); };
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

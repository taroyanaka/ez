<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Logs & Analytics</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <!-- Load Local Chart.js with CDN Fallback -->
  <script src="chart.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/chart.js';"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="../index.html" class="back-link">← TOP PAGE</a>
      <h1>Activity Logs & Analytics</h1>
      <p class="subtitle">学習モードと編集/作成モードのアクティビティ分析</p>
    </header>
      <!-- Combined Cross-sectional Chart Section -->
      <section class="charts-grid" style="margin-bottom: 40px; border-bottom: 2px solid #334155; padding-bottom: 20px;">
        <div class="chart-card" style="width: 100%;">
          <h2 style="text-align: center; color: #f8fafc; font-size: 1.5rem; margin-bottom: 10px;">📊 プロジェクト横断データ (EZ1, EZ2, EZ5)</h2>
          <div style="display: flex; gap: 20px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 300px;">
              <h3 style="color: #cbd5e1; text-align: center; font-size: 1.1rem; margin-bottom: 10px;">⏱️ 滞在時間の比較 (分)</h3>
              <div class="chart-container" style="position: relative; height: 300px;">
                <canvas id="combinedTimeChart"></canvas>
              </div>
            </div>
            <div style="flex: 1; min-width: 300px;">
              <h3 style="color: #cbd5e1; text-align: center; font-size: 1.1rem; margin-bottom: 10px;">⚡ タップ数の比較 (回)</h3>
              <div class="chart-container" style="position: relative; height: 300px;">
                <canvas id="combinedTapsChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Daily Overview Chart Section -->
      <section class="charts-grid" style="margin-bottom: 40px;">
        <div class="chart-card" style="width: 100%;">
          <h2 style="text-align: center; color: #f8fafc; font-size: 1.5rem; margin-bottom: 10px;">📅 デイリー記録の推移 (直近7日間)</h2>
          <div class="chart-container" style="position: relative; height: 320px; width: 100%;">
            <canvas id="dailyOverviewChart"></canvas>
          </div>
        </div>
      </section>

      <!-- Container for Project Specific Sections -->
      <div id="projects-container"></div>

      <!-- Template for a single project -->
      <template id="project-template">
        <div class="project-section" style="margin-bottom: 60px;">
          <h2 class="project-title" style="color: #f8fafc; font-size: 1.8rem; margin-bottom: 20px; border-left: 4px solid #6366f1; padding-left: 10px;">Project Name</h2>
          
          <!-- Stats Summary Cards -->
          <section class="summary-grid">
            <div class="card">
              <h3>総滞在時間</h3>
              <p class="value total-time">0分</p>
              <span class="card-desc">全モードの累積利用時間</span>
            </div>
            <div class="card">
              <h3>総タップ数</h3>
              <p class="value total-taps">0回</p>
              <span class="card-desc">全モードの操作回数</span>
            </div>
            <div class="card active-mode-card">
              <h3>最も活発なモード</h3>
              <p class="value active-mode">-</p>
              <span class="card-desc active-mode-desc">タップ数に基づくアクティビティ</span>
            </div>
          </section>

          <!-- Charts Section -->
          <section class="charts-grid">
            <div class="chart-card">
              <h2>⏱️ 滞在時間の比較</h2>
              <div class="chart-container">
                <canvas class="timeChart"></canvas>
              </div>
            </div>
            <div class="chart-card">
              <h2>⚡ タップ数の比較</h2>
              <div class="chart-container">
                <canvas class="tapsChart"></canvas>
              </div>
            </div>
          </section>

          <!-- Daily Chart Section -->
          <section class="daily-chart-section" style="margin: 20px 0; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05);">
            <h2 style="color: #f8fafc; font-size: 1.25rem; margin-bottom: 15px;">📈 デイリーログ (直近7日間)</h2>
            <div class="chart-container" style="position: relative; height: 300px; width: 100%;">
              <canvas class="dailyChart"></canvas>
            </div>
          </section>

          <!-- Raw Data View & Controls -->
          <section class="controls-section">
            <div class="section-header">
              <h2>📋 ログデータ詳細</h2>
              <button class="btn-danger btn-reset">ログデータをリセット</button>
            </div>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>モード</th>
                    <th>滞在時間 (秒)</th>
                    <th>滞在時間 (分:秒)</th>
                    <th>タップ数 (回)</th>
                    <th>タップ密度 (タップ/分)</th>
                  </tr>
                </thead>
                <tbody class="raw-data-body">
                  <!-- Dynamically populated -->
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </template>

  </div>

  <script src="app.js"></script>
</body>
</html>
